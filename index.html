<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ช่างไฟ สป.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ช่างไฟสมุทรปราการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen 3D world; HUD panels pinned to the corners, modals as field-tablet sheets */
:root{
  --panel: rgba(13,20,29,.84);
  --panel-2: rgba(22,32,45,.94);
  --line: rgba(190,214,235,.16);
  --fg: #eef3f7;
  --soft: #a7b5c3;
  --accent: #ff8a1e;
  --accent-ink: #1b1003;
  --ok: #3fcf8e;
  --warn: #ffc24b;
  --bad: #ff6060;
  --info: #62b0ff;
  --display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --body: "IBM Plex Sans Thai", "Chakra Petch", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;overflow:hidden;background:#0b1118;color:var(--fg);font-family:var(--body)}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#topLeft{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px, env(safe-area-inset-left,0px));padding:10px 12px;min-width:210px;pointer-events:auto}
.clock{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.5px;line-height:1;font-variant-numeric:tabular-nums}
.date{font-size:12.5px;color:var(--soft);margin-top:4px}
.money{font-family:var(--display);font-size:17px;font-weight:700;color:var(--warn);margin-top:6px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:5px;margin-top:8px}
.bar{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:6px;font-size:11.5px;color:var(--soft)}
.bar .t{height:7px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar .f{height:100%;border-radius:5px;transition:width .3s}
.bar b{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;text-align:right}
#status{font-size:11.5px;margin-top:7px;color:var(--soft)}
#status .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-weight:600;margin-right:4px}
#topRight{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px, env(safe-area-inset-right,0px));padding:8px;pointer-events:auto}
#mini{display:block;width:168px;height:168px;border-radius:8px;cursor:crosshair}
.mini-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--soft);margin-top:6px;max-width:168px}
.mini-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
#tasks{top:calc(240px + env(safe-area-inset-top,0px));right:max(10px, env(safe-area-inset-right,0px));width:236px;padding:10px 12px;pointer-events:auto;max-height:40vh;overflow:auto}
#tasks h4{margin:0 0 6px;font-family:var(--display);font-size:13px;letter-spacing:.6px;color:var(--soft);text-transform:uppercase}
.task{display:grid;gap:2px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;font-size:12.5px}
.task:hover{border-color:var(--accent)}
.task .k{font-family:var(--display);font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.task .d{color:var(--soft);font-size:11.5px}
.task.nav{border-color:var(--info);background:rgba(98,176,255,.08)}
.tag{font-size:10.5px;padding:0 6px;border-radius:10px;font-weight:700;white-space:nowrap}
.tag.pm{background:rgba(98,176,255,.18);color:var(--info)}
.tag.cm{background:rgba(255,194,75,.18);color:var(--warn)}
.tag.fail{background:rgba(255,96,96,.2);color:var(--bad)}
.tag.late{background:rgba(255,96,96,.2);color:var(--bad)}
#compass{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px}
#compass svg{width:22px;height:22px;transition:transform .1s}
#speedo{bottom:calc(64px + env(safe-area-inset-bottom,0px));right:max(10px, env(safe-area-inset-right,0px));padding:8px 14px;font-size:12.5px;text-align:right}
#speedo b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
#prompt{bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:9px 16px;font-size:14px;text-align:center;max-width:min(88vw,520px)}
#prompt kbd,.key{font-family:var(--display);background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 7px;font-weight:700;font-size:13px}
#toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:min(90vw,520px)}
.toast{padding:8px 14px;font-size:13px;animation:tin .25s ease-out;text-align:center}
.toast.bad{border-color:rgba(255,96,96,.6)}
.toast.good{border-color:rgba(63,207,142,.6)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#bottomBar{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.hbtn{font-family:var(--display);font-weight:600;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;display:flex;gap:7px;align-items:center}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--accent);outline:none}
.hbtn .key{font-size:11px;padding:0 5px}
#help{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(10px, env(safe-area-inset-left,0px));padding:8px 11px;font-size:11.5px;color:var(--soft);line-height:1.7}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .6s}
/* modal */
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,8,12,.55);padding:16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#modal[hidden]{display:none!important}
.sheet{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(0,0,0,.7)}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet header h2{margin:0;font-family:var(--display);font-size:19px;line-height:1.3;text-wrap:balance}
.sheet header .sub{font-size:12px;color:var(--soft);margin-top:3px}
.sheet .body{padding:14px 18px;overflow:auto;font-size:14px;line-height:1.65;min-width:0}
.sheet footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font-family:var(--display);font-weight:600;font-size:14px;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:rgba(255,96,96,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:5px 10px}
.x{background:none;border:0;color:var(--soft);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.row .n{font-weight:600}
.row .s{font-size:12px;color:var(--soft)}
.chk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.chk .no{font-family:var(--display);color:var(--soft);font-size:12.5px}
.chk .obs{font-size:12.5px;margin-top:2px}
.obs.good{color:var(--ok)} .obs.bad{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--body);font-size:12.5px;background:none;border:0;color:var(--soft);padding:5px 10px;cursor:pointer}
.seg button.on.ok{background:rgba(63,207,142,.2);color:var(--ok)}
.seg button.on.bad{background:rgba(255,96,96,.2);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--soft)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .t{font-size:11.5px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .soft{color:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font-family:var(--display);font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.step.done{opacity:.6}
.step .i{font-family:var(--display);font-weight:700;color:var(--accent)}
.formcode{font-family:var(--display);font-size:12px;letter-spacing:.5px;color:var(--accent)}
.lead{font-size:15px}
ul.clean{margin:6px 0;padding-left:20px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tw{overflow-x:auto}
/* touch controls */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:max(24px, env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,138,30,.75)}
#tbtns{position:absolute;right:max(20px, env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
#tbtns button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:700;font-size:15px}
#tbtns button.e{background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  #tasks{display:none}
  #mini{width:118px;height:118px}
  .mini-legend{display:none}
  #help{display:none}
  .clock{font-size:22px}
  #topLeft{min-width:168px;padding:8px 10px}
  #bottomBar{bottom:calc(176px + env(safe-area-inset-bottom,0px))}
  #speedo{bottom:calc(176px + env(safe-area-inset-bottom,0px))}
  #prompt{bottom:calc(228px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(280px + env(safe-area-inset-bottom,0px))}
  #compass{top:calc(150px + env(safe-area-inset-top,0px))}
  .kpis{grid-template-columns:1fr}
}
/* phones & tablets */
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
.sheet{max-height:88dvh}
body.touch #bottomBar{display:none}
#tbtns{grid-template-columns:repeat(3,64px)}
#tbtns button.e{font-size:18px}
#tbtns button[hidden]{display:none}
body.touch #speedo{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
body.touch #prompt{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
body.touch #toasts{bottom:calc(232px + env(safe-area-inset-bottom,0px))}
@media (max-height:540px) and (orientation:landscape){
  #joy{width:108px;height:108px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #knob{left:32px;top:32px}
  #tbtns{grid-template-columns:repeat(3,54px);gap:8px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #tbtns button{width:54px;height:54px;font-size:13px}
  #tasks,.mini-legend,#help{display:none}
  #mini{width:100px;height:100px}
  #topLeft{transform:scale(.68);transform-origin:top left}
  #compass{transform:translateX(-50%) scale(.85);top:calc(6px + env(safe-area-inset-top,0px))}
  body.touch #speedo{bottom:auto;top:calc(140px + env(safe-area-inset-top,0px))}
  body.touch #prompt{bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:40vw;font-size:13px}
  body.touch #toasts{bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(46vw,420px)}
  #modal{padding:8px}
  .sheet{max-height:96dvh}
  .sheet header{padding:8px 14px}
  .sheet .body{padding:10px 14px}
  .sheet footer{padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#fade{transition:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="โลก 3 มิติ"></canvas>

<div class="hud panel" id="topLeft">
  <div class="clock" id="clock">07:00</div>
  <div class="date" id="date"></div>
  <div class="money" id="money">฿ 0</div>
  <div class="date" id="rank"></div>
  <div class="bars">
    <div class="bar"><span>พลังงาน</span><div class="t"><div class="f" id="enF" style="background:var(--ok)"></div></div><b id="enV"></b></div>
    <div class="bar"><span>ความอิ่ม</span><div class="t"><div class="f" id="huF" style="background:var(--warn)"></div></div><b id="huV"></b></div>
    <div class="bar"><span>ความเครียด</span><div class="t"><div class="f" id="stF" style="background:#c48cff"></div></div><b id="stV"></b></div>
    <div class="bar"><span>ความสะอาด</span><div class="t"><div class="f" id="hyF" style="background:#5fd3e0"></div></div><b id="hyV"></b></div>
    <div class="bar"><span>น้ำมันรถ</span><div class="t"><div class="f" id="fuF" style="background:var(--info)"></div></div><b id="fuV"></b></div>
  </div>
  <div id="status"></div>
</div>

<div class="hud panel" id="topRight">
  <canvas id="mini" width="336" height="336" title="แผนที่ — แตะเพื่อปักหมุดนำทาง"></canvas>
  <div class="mini-legend"><span><i style="background:#ff8a1e"></i>คุณ</span><span><i style="background:#62b0ff"></i>งาน PM</span><span><i style="background:#ffc24b"></i>งานแก้ไข</span><span><i style="background:#ff6060"></i>ขัดข้อง</span></div>
</div>

<div class="hud panel" id="tasks"><h4>งานที่รับไว้</h4><div id="taskList"></div></div>
<div class="hud panel" id="compass" hidden><svg viewBox="0 0 24 24" id="compArrow"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="#ff8a1e"/></svg><span id="compText"></span></div>
<div class="hud panel" id="prompt" hidden></div>
<div class="hud panel" id="speedo" hidden></div>
<div class="hud" id="toasts"></div>
<div class="hud" id="bottomBar">
  <button class="hbtn" id="bPhone"><span class="key">Tab</span>มือถือ CMMS</button>
  <button class="hbtn" id="bTruck"><span class="key">F</span>ขึ้น/ลงรถ</button>
  <button class="hbtn" id="bSound">🔊 เสียง</button>
</div>
<div class="hud panel" id="help"><span class="key">WASD</span> เดิน · <span class="key">Shift</span> วิ่ง · <span class="key">E</span> ใช้งาน · ลากเมาส์หมุนกล้อง · ล้อเมาส์ซูม</div>
<div id="fade"></div>
<div id="touch" hidden><div id="joy"><div id="knob"></div></div><div id="tbtns"><button id="tRun">วิ่ง</button><button id="tF">รถ</button><button id="tTab">☎</button><button id="tH">แตร</button><button id="tFS" hidden>⛶</button><button class="e" id="tE">E</button></div></div>

<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><header><div><h2 id="mTitle"></h2><div class="sub" id="mSub"></div></div><button class="x" id="mClose" aria-label="ปิด">×</button></header><div class="body" id="mBody"></div><footer id="mFoot"></footer></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
/* ================= utilities ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20261111);
const rr = (a,b)=>a+rng()*(b-a);
const R = (a,b)=>a+Math.random()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const TH_MF = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_D = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];

/* ================= game state ================= */
const START = {y:2026,m:10,d:11};       // วันพุธที่ 11 พ.ย. 2569
const SAVE_KEY = "mea-life-3d-v1";
const fresh = () => ({
  gameMin: 0, money: 2500, energy: 88, hunger: 70,
  px: -80, pz: 82, inTruck:false, tx: 26, tz: 26, th: Math.PI,
  wos: [], fails: [], seq: 1, fseq: 1, clockIn: {}, paid: {}, log: [],
  stats: { reports:0, correct:0, accidents:0, earned:0 },
  target: null, lastHour: 7, intro: false, dayGen: {},
  fuel: 100, svcDue: 5, stress: 12, level: 0, xp: 0, rentPaid: {}, rain: 0, rainH: 0,
  complaints: 0, evals: [], team: [], train: {best:null, runs:0}, sound: true, pending: [], imported: 0,
  timeScale: .5, hygiene: 80, outfit: "casual", onBike:false, bx: -86, bz: 80, bh: 0,
  rel: {}, chats: {}, unread: {}, lineQ: [], partner: null, appts: [], argue: null, inv: {coffee:0, snack:0, flower:0, box:[]},
  fridge: {rice:2, egg:4, pork:1, basil:1, garlic:3, tofu:0, veg:0, sauce:6, oil:6, noodle:2}, cooked: 0, me: {name:"", sex:"m"}, events: {},
  stock: {}, orders: [], redo: [], gone: {}, hired: {}, story: {}, promo: null, music: true, budget: 30000
});
let S;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); } catch(e){ S = null; }
if (!S || !S.wos) S = fresh(); else S = Object.assign(fresh(), S);
const LEVELS = [
  {n:"ช่างไฟฟ้า ระดับ 1", wage:650, xp:0},
  {n:"ช่างไฟฟ้า ระดับ 2", wage:760, xp:120},
  {n:"หัวหน้าชุดบำรุงรักษา", wage:900, xp:300, team:true},
  {n:"วิศวกรไฟฟ้า", wage:1150, xp:560, team:true},
];

function measure(name){
  if (name.startsWith("วัดแรงดัน")){
    const bad = Math.random()<.18; const v = [R(222,234),R(222,234),R(222,234)].map(Math.round);
    if (bad){ const i = RI(0,2); v[i] = Math.random()<.5 ? RI(196,212) : RI(239,248); }
    return {bad, obs:`V1-N ${v[0]} · V2-N ${v[1]} · V3-N ${v[2]} V (เกณฑ์ 214–237 V)`};
  }
  const bad = Math.random()<.18; let a = [R(280,360),R(280,360),R(280,360)].map(Math.round);
  if (bad){ const i = RI(0,2); a[i] = RI(470,560); }
  const avg = (a[0]+a[1]+a[2])/3, unb = Math.max(...a.map(x=>Math.abs(x-avg)))/avg*100;
  return {bad, obs:`I1 ${a[0]} · I2 ${a[1]} · I3 ${a[2]} A · ไม่สมดุล ${unb.toFixed(0)}% (เกณฑ์ ≤ 20%, ต่อเส้น < 400 A)`};
}

const COL = [];
function solid(x,z,w,d){ COL.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2}); }
function building(x,z,w,d,h,mi){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), buildMats[mi%buildMats.length]); m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  BLD.push({m, x, z, mi:mi%BCOL.length});
  box(w+.4,.5,d+.4,roofMat,x,h+.25,z);
  if (rng()<.5) box(1.4,1,1,0x9aa3a8,x+w*.25,h+1,z-d*.2); // aircon / tank
  // shophouse front: awning + shop sign facing the nearest road
  let best=null, bd=1e9;
  ROADS.forEach(r=>{ const a=Math.abs(x-r), b=Math.abs(z-r); if (a<bd){bd=a;best={ax:"x",r};} if (b<bd){bd=b;best={ax:"z",r};} });
  if (best && bd<30 && h<20){
    const col = AWN[Math.floor(rng()*AWN.length)];
    if (best.ax==="x"){ const s=Math.sign(best.r-x), fx=x+s*(w/2+.9); box(1.8,.12,d*.9,col,fx,3.2,z,scene,false); box(.12,1.1,d*.7,SIGN[Math.floor(rng()*SIGN.length)],x+s*(w/2+.07),4.3,z,scene,false); }
    else { const s=Math.sign(best.r-z), fz=z+s*(d/2+.9); box(w*.9,.12,1.8,col,x,3.2,fz,scene,false); box(w*.7,1.1,.12,SIGN[Math.floor(rng()*SIGN.length)],x,4.3,z+s*(d/2+.07),scene,false); }
  }
  solid(x,z,w,d);
}

/* ---- labels ---- */
function label(text, opt={}){
  const fs = opt.size||40, pad=16;
  const tmp = document.createElement("canvas").getContext("2d"); tmp.font = `700 ${fs}px "Chakra Petch","IBM Plex Sans Thai",sans-serif`;
  const tw = Math.ceil(tmp.measureText(text).width);
  const tex = canvasTex(tw+pad*2, fs+pad*1.6, (g,w,h)=>{
    g.fillStyle = opt.bg||"rgba(13,20,29,.82)"; const r=14;
    g.beginPath(); g.moveTo(r,0); g.arcTo(w,0,w,h,r); g.arcTo(w,h,0,h,r); g.arcTo(0,h,0,0,r); g.arcTo(0,0,w,0,r); g.fill();
    g.font = `700 ${fs}px "Chakra Petch","IBM Plex Sans Thai",sans-serif`; g.fillStyle = opt.color||"#eef3f7"; g.textBaseline="middle"; g.fillText(text,pad,h/2+2);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:opt.depth!==false, transparent:true}));
  const sc = (opt.scale||1)*0.045; sp.scale.set((tw+pad*2)*sc, (fs+pad*1.6)*sc, 1);
  return sp;
}

  const [x0,x1]=BX[i], [z0,z1]=BX[j];
  if (kind==="office"||kind==="market"||kind==="store"||kind==="gas") continue;
  const step = kind==="home"?16:15, m=7.5;
  for (let x=x0+m+step/2; x<=x1-m-step/2+1; x+=step) for (let z=z0+m+step/2; z<=z1-m-step/2+1; z+=step){

    if (rng()<.22) continue;
    if (kind==="home"){ house(x,z,rr(8,11),rr(7,10)); continue; }
    building(x+rr(-1,1),z+rr(-1,1),rr(9,13),rr(9,13),rr(6,i===2||j===2?24:16),Math.floor(rng()*8));
  }
}
function house(x,z,w,d,col){
  const g = new THREE.Group(); g.position.set(x,0,z); scene.add(g);

/* ================= time & needs ================= */
let paused = false;
function advanceBase(mins, effort=0){
  const steps = Math.max(1, Math.ceil(mins));
  const per = mins/steps;
  for (let i=0;i<steps;i++){
    S.gameMin += per;
    const hRate = sleeping ? .035 : .075;
    S.hunger = clamp(S.hunger - hRate*per, 0, 100);
    if (!sleeping) S.energy = clamp(S.energy - (.055 + effort*.06 + (S.hunger<=0?.08:0) + (S.stress>75?.02:0))*per, 0, 100);
    const md = minOfDay(), offHours = md<8*60 || md>17*60;
    if (sleeping) S.stress -= .06*per;
    else if (effort>0) S.stress += (.025*effort + (offHours?.025:0))*per;
    else S.stress -= (isWeekend(today())?.02:.006)*per;
    S.stress = clamp(S.stress, 0, 100);
    S.hygiene = clamp(S.hygiene - (.012 + effort*.02 + (S.rain>0 && !S.inTruck ? .02 : 0))*per*(sleeping?.3:1), 0, 100);
    S.team.forEach(t => { if (t.wo && absMin()>=t.until) teamFinish(t); });
    if (S.lineQ.length) lineReplies();
    const h = Math.floor(absMin()/60);
    while (S.lastHour < h){ S.lastHour++; onHour(S.lastHour); }
  }
}
let sleeping = false;
function onHourBase(hAbs){
  const hr = hAbs%24, d = Math.floor(hAbs/24), dt = dateOf(d);
  if (hr===0){
    const late = S.wos.filter(w=>w.kind==="PM" && w.status!=="done" && w.due===d-1);
    if (late.length && !sleeping) toast(`ใบงาน ${late.map(w=>w.code).join(", ")} เกินกำหนดแล้ว`, "bad");
    if (dt.getDate()===1) S.pending.push({type:"month", day:d});
  }
  if (hr===6 && !S.dayGen[d]){
    S.dayGen[d] = true;
    if (!isWeekend(d)){ genDailyPM(RI(2,3)); if (!sleeping) toast("มีใบงานใหม่บนบอร์ดที่สำนักงาน"); }
  }
  if (hr===8 && dt.getDate()===1 && !S.rentPaid[d]){
    S.rentPaid[d] = true;
    S.money -= 3500; S.log.unshift({t:absMin(), n:-3500, why:"ค่าเช่าห้องรายเดือน"});
    S.money -= 640;  S.log.unshift({t:absMin(), n:-640, why:"ค่าน้ำ ค่าไฟ ค่าอินเทอร์เน็ต"});
    toast("หักค่าเช่าห้องและค่าน้ำค่าไฟ ฿4,140", "bad");
    if (S.money<0){ S.stress = clamp(S.stress+20,0,100); toast("เงินติดลบ! ค้างจ่ายค่าเช่า เครียดหนัก", "bad"); }
  }
  if (hr===17 && !S.paid[d] && !isWeekend(d)){
    S.paid[d] = true;
    const ci = S.clockIn[d];
    if (ci != null){
      let pay = LEVELS[S.level].wage; const lateMin = ci - 8*60 - 30;
      const note = lateMin>0 ? ` (สาย ${Math.round(lateMin)} นาที หัก 100)` : "";
      if (lateMin>0) pay -= 100;
      earn(pay, `ค่าแรงวันที่ ${fmtDay(d)}${note}`);
    } else if (!sleeping) toast("วันนี้ไม่ได้ลงเวลาทำงาน — ไม่ได้รับค่าแรง", "bad");
    S.pending.push({type:"day", day:d});
    if (dt.getDay()===5) S.pending.push({type:"eval", day:d});
  }
  // weather: end of the rainy season, sudden storms
  if (S.rain>0){ S.rain--; S.rainH++; if (!S.rain){ S.rainH=0; if (!sleeping) toast("ฝนหยุดแล้ว น้ำเริ่มลด"); } }
  else if (Math.random()<.07){ S.rain = RI(2,5); S.rainH = 0; if (!sleeping) toast("🌧 ฝนตกหนัก — ระวังถนนลื่นและไฟดับบ่อยขึ้น", "bad"); }
  // customers calling about outages
  S.fails.filter(f=>!f.end).forEach(f=>{
    if (hr>=6 && hr<=23 && Math.random()<(f.ack?.25:.55)){
      f.calls = (f.calls||0)+1; S.complaints++; S.stress = clamp(S.stress+3,0,100);
      if (!sleeping) toast(`☎ ลูกค้าแถว${EQ[f.eqId].place}โทรร้องเรียน — ไฟดับมา ${((absMin()-f.start)/60).toFixed(1)} ชม.`, "bad");
    }
  });
  socialHour(hr, d);
  if (hr>=7 && hr<=21){
    const actives = S.fails.filter(f=>!f.end).length;
    if (actives<3 && Math.random() < (S.rain>0 ? .26 : .1)) triggerFailure();
  }
  save();
}
function earn(n, why){ S.money += n; S.stats.earned += n; S.log.unshift({t:absMin(), n, why}); S.log = S.log.slice(0,60); toast(`${n>=0?"+":""}${fmtB(n)} · ${why}`, n>=0?"good":"bad"); sfx("coin"); }
function spend(n, why){ if (S.money < n){ toast("เงินไม่พอ", "bad"); return false; } S.money -= n; S.log.unshift({t:absMin(), n:-n, why}); S.log=S.log.slice(0,60); return true; }

function triggerFailureOld(){
  const cands = EQUIP.filter(e => !activeFail(e.id));
  const e = pick(cands);
  const f = {id:"F"+(S.fseq++), eqId:e.id, start:absMin(), cause:pick(CAUSES[e.type]), end:null, calls:0, rain:S.rain>0};
  S.fails.push(f);

  S.wos.push(w); f.wo = w.code;

  lineIn("team", `ธนา (ศูนย์สั่งการ): แจ้งไฟดับ ${e.place} อุปกรณ์ ${e.id} ขอช่างเข้าพื้นที่ครับ`, true);

}

    return;
  }
  if (!LIFT.on){ advance(5,.5); toast("ยกกระเช้าขึ้นไปที่ยอดเสา"); sfx("lift"); }
  LIFT.on = true; LIFT.eq = e;
  const ud = truck.userData; ud.pivot.rotation.order = "YXZ";

const _bp = new THREE.Vector3();
function animateLift(dt){
  const ud = truck.userData, want = LIFT.on && !$("modal").hidden ? 1 : 0;
  if (!want && LIFT.on) LIFT.on = false;
  LIFT.k += (want - LIFT.k) * Math.min(1, dt*2.2);
  ud.pivot.rotation.x = -.06 - LIFT.k*1.0;
  ud.bucket.rotation.x = -ud.pivot.rotation.x;
  if (LIFT.k < .02){ if (!LIFT.on){ LIFT.eq = null; ud.pivot.rotation.y *= .9; } return; }
  ud.bucket.getWorldPosition(_bp);
  player.visible = true; player.position.set(_bp.x, _bp.y+.4, _bp.z);
  if (LIFT.eq) player.rotation.y = Math.atan2(LIFT.eq.x-_bp.x, LIFT.eq.z-_bp.z);

  }

  openModal("บันทึกผลแล้ว", `${w.code} ปิดเป็น "เสร็จสิ้น"`, `<p class="lead ${correct?"ok":"warn"}">${correct?"ประเมินถูกต้อง":"ประเมินไม่ถูกต้อง"}</p><p>${esc(text)}</p>${cm}`, [{label:"เรียบร้อย", cls:"primary", fn:closeModal}]);

/* ---- evaluation (weekly) & monthly KPI bonus ---- */
function kpisFor(y, m){
  const inM = d => { const x = dateOf(d); return x.getFullYear()===y && x.getMonth()===m; };
  const inMa = a => inM(dayOf(a));
  const pm = S.wos.filter(w=>w.kind==="PM" && inM(w.due));
  const done = pm.filter(w=>w.status==="done").length;
  const over = pm.filter(w=>w.status!=="done" ? today()>w.due : w.late).length;
  const rep = S.fails.filter(f=>f.end && inMa(f.end)), mttr = rep.length ? rep.reduce((s,f)=>s+(f.end-f.start)/60,0)/rep.length : null;
  const fc = S.fails.filter(f=>inMa(f.start)).length;
  return { label:`${TH_MF[m]} ${y+543}`, total:pm.length, done, over, comp: pm.length?done/pm.length*100:null, ovr: pm.length?over/pm.length*100:null, mttr, fc, rep:rep.length };
}
function weekScore(d){
  const lo = d-6, inW = x => x>=lo && x<=d;
  const pm = S.wos.filter(w=>w.kind==="PM" && inW(w.due));
  const comp = pm.length ? pm.filter(w=>w.status==="done").length/pm.length*100 : null;
  const ovr = pm.length ? pm.filter(w=>w.status!=="done"||w.late).length/pm.length*100 : null;
  const rep = S.fails.filter(f=>f.end && inW(dayOf(f.end))), mttr = rep.length ? rep.reduce((s,f)=>s+(f.end-f.start)/60,0)/rep.length : null;
  const mine = S.wos.filter(w=>w.kind==="PM" && w.status==="done" && !w.byTeam && inW(dayOf(w.doneAt)));
  const acc = mine.length ? mine.filter(w=>w.correct).length/mine.length : null;
  const calls = S.fails.filter(f=>inW(dayOf(f.start))).reduce((s,f)=>s+(f.calls||0),0);
  const accid = S.stats.accidents - (S.evals.length ? S.evals[S.evals.length-1].accTotal : 0);
  const parts = [
    ["PM Completion", comp==null?"–":comp.toFixed(0)+"%", comp==null?20:Math.round(Math.min(comp/90,1)*30), 30],
    ["Overdue PM", ovr==null?"–":ovr.toFixed(0)+"%", ovr==null?15:Math.round(ovr<=10?15:Math.max(0,15-(ovr-10)*.6)), 15],
    ["MTTR", mttr==null?"ไม่มีเหตุ":mttr.toFixed(1)+" ชม.", mttr==null?15:Math.round(mttr<=4?20:Math.max(0,20-(mttr-4)*5)), 20],
    ["ความถูกต้องของรายงาน", acc==null?"–":Math.round(acc*100)+"%", acc==null?12:Math.round(acc*20), 20],
    ["ลูกค้าร้องเรียน", calls+" ครั้ง", Math.max(0,10-calls), 10],
    ["อุบัติเหตุ", accid+" ครั้ง", -accid*10, 0],
  ];
  return {parts, score: clamp(parts.reduce((s,p)=>s+p[2],0),0,100), accTotal:S.stats.accidents};
}

const ORDER_STEPS = ["ตรวจสอบรายละเอียดงานและแผนที่","ตั้งป้ายเตือนและกั้นพื้นที่","ตรวจสอบ PPE และทำ KYT","แจ้งศูนย์สั่งการขอ Switching","ทดสอบไม่มีแรงดัน ต่อสายดินชั่วคราว","ปฏิบัติงานซ่อม","ถอดสายดิน แจ้งจ่ายไฟคืน"];
let TR = null;
function openTraining(){
  TR = {i:0, ans:[], shuffled: ORDER_STEPS.map((s,i)=>i).sort(()=>Math.random()-.5), picked:[]};
  renderTraining();
}
function renderTraining(){
  if (TR.i < QUIZ.length){
    const [q, opts] = QUIZ[TR.i];
    openModal("ห้องฝึกอบรม · ทดสอบความรู้", `ข้อ ${TR.i+1} จาก ${QUIZ.length+1} · อ้างอิงแบบฟอร์ม SF-07 และคู่มือ SW-OH`,
      `<p class="lead">${q}</p><div class="rows">${opts.map((o,i)=>`<button class="btn" style="text-align:left" data-act="tq" data-arg="${i}">${o}</button>`).join("")}</div>`, [{label:"ออก", fn:closeModal}]);
    return;
  }
  const remain = TR.shuffled.filter(i=>!TR.picked.includes(i));
  openModal("ห้องฝึกอบรม · เรียงขั้นตอน", "ข้อสุดท้าย: แตะขั้นตอนตามลำดับที่ถูกต้องตามคู่มือ SW-OH (งานซ่อมเหตุขัดข้อง)",
    `<p>ลำดับที่เลือกแล้ว:</p><ol class="clean">${TR.picked.map(i=>`<li>${ORDER_STEPS[i]}</li>`).join("")||"<li class='soft'>ยังไม่ได้เลือก</li>"}</ol>
     <div class="rows">${remain.map(i=>`<button class="btn" style="text-align:left" data-act="to" data-arg="${i}">${ORDER_STEPS[i]}</button>`).join("")}</div>`,
    [{label:"เริ่มเรียงใหม่", fn:()=>{ TR.picked=[]; renderTraining(); }},{label:"ส่งคำตอบ", cls:"primary", disabled:remain.length>0, fn:finishTraining}]);
}
bodyActs.tq = i => { TR.ans.push(+i); TR.i++; sfx("click"); renderTraining(); };
bodyActs.to = i => { TR.picked.push(+i); renderTraining(); };
function finishTraining(){
  const mc = TR.ans.filter((a,i)=>a===QUIZ[i][2]).length;
  const pos = TR.picked.filter((v,i)=>v===i).length;
  const score = mc + Math.floor(pos/ORDER_STEPS.length*4);
  advance(45);
  const first = !S.train.lastDay || S.train.lastDay!==today();
  S.train.runs++; S.train.lastDay = today(); if (S.train.best==null || score>S.train.best) S.train.best = score;
  if (first){ S.xp += score*3; S.stress = clamp(S.stress-5,0,100); }
  save();
  openModal("ผลการทดสอบ", `คะแนนสูงสุดของคุณ ${S.train.best}/10`,
    `<p class="lead">ได้ <b class="${score>=8?"ok":score>=5?"warn":"bad"}">${score}/10</b></p>
     <p>ตอบถูก ${mc}/${QUIZ.length} ข้อ · เรียงขั้นตอนถูกตำแหน่ง ${pos}/${ORDER_STEPS.length}</p>
     <ul class="clean">${QUIZ.map((q,i)=>`<li class="${TR.ans[i]===q[2]?"ok":"bad"}">${q[0]} — ${q[1][q[2]]}</li>`).join("")}</ul>
     <p class="soft">ลำดับที่ถูกต้อง: ${ORDER_STEPS.join(" → ")}</p>${first?`<p class="ok">+${score*3} ประสบการณ์ (นับวันละครั้ง)</p>`:""}`,
    [{label:"ปิด", cls:"primary", fn:closeModal}]);
}

let xlsxP = null;
function loadXLSX(){ if (window.XLSX) return Promise.resolve(); if (xlsxP) return xlsxP; xlsxP = new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); return xlsxP; }
function parseCSV(t){ const rows=[]; let r=[], f="", q=false; for (let i=0;i<t.length;i++){ const c=t[i]; if (q){ if (c==='"'){ if (t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; } else if (c==='"') q=true; else if (c===','){ r.push(f); f=""; } else if (c==="\n"||c==="\r"){ if (c==="\r"&&t[i+1]==="\n") i++; r.push(f); f=""; if (r.some(x=>x!=="")) rows.push(r); r=[]; } else f+=c; } if (f!==""||r.length){ r.push(f); rows.push(r); } return rows; }
function typeFromText(t){ t=String(t).toLowerCase(); if (/หม้อแปลง|transformer|tr-|\btr\b/.test(t)) return "transformer"; if (/lbs|load break/.test(t)) return "lbs"; if (/rmu|ring main/.test(t)) return "rmu"; if (/sectional|sz/.test(t)) return "sectionalizer"; if (/cap/.test(t)) return "capbank"; if (/network|nw|ตาข่าย/.test(t)) return "netprotector"; if (/unit ?sub|สถานีย่อย/.test(t)) return "substation"; return null; }
async function importFile(file){
  let rows;
  try {
    if (/\.xlsx?$/i.test(file.name)){ await loadXLSX(); const wb = XLSX.read(await file.arrayBuffer(), {type:"array"}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:""}); }
    else rows = parseCSV((await file.text()).replace(/^﻿/,""));
  } catch(e){ toast("อ่านไฟล์ไม่สำเร็จ — ใช้ไฟล์ .xlsx หรือ .csv ที่ส่งออกจากหน้าใบงาน", "bad"); return; }
  if (!rows || rows.length<2){ toast("ไฟล์ไม่มีข้อมูล", "bad"); return; }
  const H = rows[0].map(h=>String(h).trim().toUpperCase());
  const col = (...names) => H.findIndex(h=>names.some(n=>h===n.toUpperCase()));
  const cCode = col("Work Order","WONUM","เลขที่ใบงาน"), cDesc = col("Description","อุปกรณ์"), cMea = col("MEA No.","MEANO"), cSt = col("Status","สถานะ"), cType = col("Work Type","WORKTYPE");
  if (cCode<0 || cDesc<0){ toast("ไม่พบคอลัมน์ Work Order และ Description ในไฟล์", "bad"); return; }
  let n = 0, k = 0;
  for (const r of rows.slice(1)){
    if (n>=30) break;
    const code = String(r[cCode]||"").trim(), desc = String(r[cDesc]||"").trim(); if (!code||!desc) continue;
    const st = cSt>=0 ? String(r[cSt]).toLowerCase() : "";
    if (/close|comp|เสร็จ|canc|ยกเลิก/.test(st)) continue;
    if (S.wos.some(w=>w.code===code)) continue;
    const mea = cMea>=0 ? String(r[cMea]).trim() : "";
    const ty = typeFromText(desc+" "+mea);
    const eq = EQ[mea] || (ty && pick(EQUIP.filter(e=>e.type===ty))) || EQUIP[k % EQUIP.length];
    const isCM = cType>=0 && /C$/i.test(String(r[cType]).trim());
    let due = today() + (k%4); while (isWeekend(due)) due++;
    S.wos.push(isCM ? {code, kind:"CM", eqId:eq.id, created:today(), due, status:"open", desc, hasPart:false, part:"อะไหล่ตามใบงาน", imported:true}
                    : {code, kind:"PM", eqId:eq.id, created:today(), due, status:"open", desc, imported:true});
    n++; k++;
  }
  S.imported += n; save();
  toast(n ? `นำเข้าใบงานจริง ${n} ใบ — อยู่บนบอร์ดใบงานแล้ว` : "ไม่มีใบงานที่ยังเปิดอยู่ในไฟล์นี้", n?"good":"bad");
  openCMMS();
}

const AU = {};
function audioInitBase(){
  if (AU.ctx || !S.sound) return;
  try {
    const C = new (window.AudioContext||window.webkitAudioContext)(); AU.ctx = C;
    const buf = C.createBuffer(1, C.sampleRate*2, C.sampleRate), d = buf.getChannelData(0); let last=0;
    for (let i=0;i<d.length;i++){ const w = Math.random()*2-1; last = (last + .02*w)/1.02; d[i] = last*3.5 + w*.15; }
    const noise = () => { const s = C.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    AU.master = C.createGain(); AU.master.gain.value = .9; AU.master.connect(C.destination);
    const city = noise(), cf = C.createBiquadFilter(); cf.type="lowpass"; cf.frequency.value=380; AU.city = C.createGain(); AU.city.gain.value=.05; city.connect(cf).connect(AU.city).connect(AU.master);
    const rn = C.createBufferSource(); const rb = C.createBuffer(1, C.sampleRate, C.sampleRate), rd = rb.getChannelData(0); for (let i=0;i<rd.length;i++) rd[i]=Math.random()*2-1; rn.buffer=rb; rn.loop=true; rn.start();
    const rf = C.createBiquadFilter(); rf.type="bandpass"; rf.frequency.value=2600; rf.Q.value=.4; AU.rain = C.createGain(); AU.rain.gain.value=0; rn.connect(rf).connect(AU.rain).connect(AU.master);
    AU.eng = C.createOscillator(); AU.eng.type="sawtooth"; AU.eng.frequency.value=45; const ef = C.createBiquadFilter(); ef.type="lowpass"; ef.frequency.value=260; AU.engG = C.createGain(); AU.engG.gain.value=0; AU.eng.connect(ef).connect(AU.engG).connect(AU.master); AU.eng.start();
  } catch(e){}
}
function audioTickBase(){
  if (!AU.ctx) return; const t = AU.ctx.currentTime, h = minOfDay()/60;
  AU.master.gain.setTargetAtTime(S.sound ? .9 : 0, t, .1);
  AU.city.gain.setTargetAtTime(h>6&&h<22 ? .05 : .018, t, .5);
  AU.rain.gain.setTargetAtTime(S.rain>0 ? .07 : 0, t, .8);
  AU.engG.gain.setTargetAtTime(S.inTruck && !paused ? .045 + Math.abs(P.v)*.002 : 0, t, .2);
  AU.eng.frequency.setTargetAtTime(42 + Math.abs(P.v)*3.2, t, .15);
}
function sfxBase(kind){
  if (!AU.ctx || !S.sound) return; const C = AU.ctx, t0 = C.currentTime;
  const tone = (f, at, dur, type="sine", vol=.12) => { const o=C.createOscillator(), g=C.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t0+at); g.gain.linearRampToValueAtTime(vol,t0+at+.01); g.gain.exponentialRampToValueAtTime(.001,t0+at+dur); o.connect(g).connect(AU.master); o.start(t0+at); o.stop(t0+at+dur+.05); };
  if (kind==="click") tone(880,0,.06,"square",.04);
  else if (kind==="coin"){ tone(988,0,.1); tone(1319,.08,.22); }
  else if (kind==="ring"){ for (let i=0;i<3;i++){ tone(1200,i*.5,.18,"square",.05); tone(1500,i*.5+.2,.18,"square",.05); } }
  else if (kind==="lift"){ tone(140,0,1.2,"sawtooth",.04); }
  else if (kind==="bad") tone(180,0,.35,"sawtooth",.08);
  else if (kind==="line"){ tone(1047,0,.08,"sine",.07); tone(1568,.09,.14,"sine",.07); }
  else if (kind==="horn"){ tone(392,0,.45,"square",.06); tone(494,0,.45,"square",.05); }
  else if (kind==="shower"){ for (let i=0;i<10;i++) tone(2000+Math.random()*1500,i*.07,.06,"triangle",.015); }
}

const strHash = s => { let h = 7; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))|0; return Math.abs(h); };
const OFFICE_SPOTS = [[-14,18],[-8,22],[-2,19],[4,23],[10,18],[16,21],[-12,27],[6,28],[20,27],[0,30]];
const NPCS = PEOPLE.filter(p=>!p.remote).map((p,i) => {

function npcPlan(n){
  const id = n.p.id, md = minOfDay(), d = today(), wd = !isWeekend(d), h = strHash(id+d);
  if (!isActive(id)) return null;
  if (id==="beer" && S.story.beerLeave!=null && S.story.beer===1 && d<=S.story.beerLeave) return null;
  if (S.partner===id) return {follow:true};
  const ap = S.appts.find(a=>a.id===id && !a.done && absMin()>=a.at-40 && absMin()<=a.at+60);
  if (ap) return {x:MKT.x+4, z:MKT.z+9};
  if (S.story.partyDay===d && md>=17*60+30 && md<20*60+30 && !S.story.chanDone && (n.p.tech||["boss","namfon","ann"].includes(id))) return {x:MKT.x-9+(n.i%7)*3, z:MKT.z+9+(n.i%3)*2.2};
  if (n.p.place==="market") return (md>=6*60 && md<20*60) ? {x:MKT.x-15, z:MKT.z-3.5} : null;
  if (wd){
    const off = OFFICE_SPOTS[n.i % OFFICE_SPOTS.length];
    if (md < 7*60+30+ (h%40) || md > 18*60+30) return null;
    if (md>=12*60 && md<13*60) return {x:MKT.x-20+(n.i%6)*7, z:MKT.z+9+(n.i%2)*3};
    if (md>=17*60+15) return h%3===0 ? {x:MKT.x-10+(n.i%5)*5, z:MKT.z+12} : null;
    if (md>=13*60 && n.p.tech && h%2===0 && n.p.id!=="boss"){ const e = EQUIP[h % EQUIP.length]; return {x:e.x+2.5, z:e.z+2.5, field:true}; }
    if (S.argue && (S.argue.a===id || S.argue.b===id)) return {x:-2.5+(S.argue.a===id?-1.2:1.2), z:21};
    return {x:off[0], z:off[1]};
  }
  if (md>=10*60 && md<19*60 && h%5<2) return {x:MKT.x-18+(n.i%7)*6, z:MKT.z+11};
  return null;
}
function setBubble(n, text, secs=4){
  if (n.bub){ n.m.g.remove(n.bub); n.bub.material.map.dispose(); }
  n.bub = label(text, {size:24, scale:.62, bg:"rgba(250,250,247,.95)", color:"#1b2430"}); n.bub.position.y = 3.75; n.m.g.add(n.bub); n.bubT = secs;
}
function updateNPCs(dt){
  for (const n of NPCS){
    const plan = npcPlan(n), g = n.m.g;
    if (n.bubT>0){ n.bubT -= dt; if (n.bubT<=0 && n.bub){ g.remove(n.bub); n.bub = null; } }
    if (!plan){ g.visible = false; n.vis = false; continue; }
    let tx, tz;
    if (plan.follow){
      if (S.inTruck || S.onBike){ g.visible=false; n.vis=false; n.x=S.px; n.z=S.pz; continue; }
      const f = player.rotation.y; tx = S.px - Math.sin(f)*1.8 + Math.cos(f)*1.2; tz = S.pz - Math.cos(f)*1.8 - Math.sin(f)*1.2;
      if (!n.vis){ n.x = tx; n.z = tz; }
    } else { tx = plan.x; tz = plan.z; }
    if (!n.vis || Math.hypot(tx-n.x, tz-n.z) > 70){ n.x = tx; n.z = tz; }
    n.vis = true; g.visible = true;
    const dx = tx-n.x, dz = tz-n.z, l = Math.hypot(dx,dz), sp = plan.follow ? (l>4?8:5) : 3.2;
    if (l > .35){ const st = Math.min(l, sp*dt); n.x += dx/l*st; n.z += dz/l*st; n.face = Math.atan2(dx,dz); n.walk += dt*9; }
    else if (!plan.follow){ n.face = Math.atan2(S.px-n.x, S.pz-n.z); }
    const sw = l>.35 ? Math.sin(n.walk)*.6 : 0;
    animLimbs(n.m, sw);
    g.position.set(n.x, 0, n.z);
    let df = ((n.face - g.rotation.y + Math.PI*3)%(Math.PI*2))-Math.PI; g.rotation.y += df*Math.min(1,dt*8);
    const pd = Math.hypot(S.px-n.x, S.pz-n.z);
    if (S.argue && (S.argue.a===n.p.id || S.argue.b===n.p.id) && n.bubT<=0) setBubble(n, pick(S.argue.a===n.p.id ? ARGUE_LINES_A : ARGUE_LINES_B), 3);
    else if (pd < 8 && n.bubT<=0 && Math.random() < dt*.07 && !paused){
      const r = relOf(n.p.id), T = TONE[n.p.tone];
      setBubble(n, fill(r.f < -25 ? pick(["…","(มองค้อน)","ชิ"]) : pick(T.small.concat(r.r>45&&n.p.single?["(แอบมอง)","วันนี้ดูดีนะ"]:[], S.hygiene<30?["เหม็นเหงื่อจัง…"]:[])), n.p));
    }
  }
}

function maybeConflict(){

const chatName = id => id==="team" ? "ทีมบำรุงรักษา สป. (กลุ่ม)" : PP[id].name;
function lineIn(id, text, quiet){
  const c = S.chats[id] || (S.chats[id] = []); c.push({m:0, t:text, at:absMin()}); if (c.length>60) c.shift();
  if (CHATV===id && !$("modal").hidden){ renderChat(); return; }
  S.unread[id] = (S.unread[id]||0)+1;
  if (!sleeping && !quiet){ toast(`LINE · ${id==="team"?"กลุ่มทีม":PP[id].name}: ${text}`); sfx("line"); }
}
function lineOutBase(id, text, intent){
  const c = S.chats[id] || (S.chats[id] = []); c.push({m:1, t:text, at:absMin()}); if (c.length>60) c.shift();
  S.lineQ.push({id, intent, at:absMin()+RI(2,18)});
}
function lineReplies(){
  for (let i=S.lineQ.length-1;i>=0;i--){ const q = S.lineQ[i]; if (absMin()>=q.at){ S.lineQ.splice(i,1); lineReply(q.id, q.intent); } }
}
function lineReplyBase(id, intent){
  if (id==="team"){
    const who = pick(PEOPLE.filter(p=>p.tech&&isActive(p.id)));
    const t = intent==="help" ? (Math.random()<.5 ? `${who.name}: ว่างอยู่ เดี๋ยวช่วยรับงาน PM ให้ใบนึง` : `${who.name}: งานล้นมือเหมือนกัน 😅`) : intent==="ok" ? pick(["หัวหน้าประเสริฐ: 👍","วิชัย: รับทราบ"]) : `${who.name}: ${pick(["555","สู้ๆ ทุกคน","ใครไปตลาดฝากข้าวมันไก่ด้วย","ฝนจะตกแล้ว ระวังนะ"])}`;
    if (intent==="help" && t.includes("ว่างอยู่")){ const w = S.wos.find(x=>x.kind==="PM" && x.status==="accepted" && !x.form); if (w){ let tm = S.team.find(x=>x.name===who.name); if (!tm){ tm={name:who.name, wo:null, until:0, pid:who.id}; S.team.push(tm);} if (!tm.wo){ tm.wo=w.code; tm.until=absMin()+RI(150,260); w.status="team"; w.teamBy=who.name; } } }
    return lineIn("team", t);
  }
  const p = PP[id], r = relOf(id), md = minOfDay();
  if (md < 6*60 && r.status!=="dating" && id!=="mom") { S.lineQ.push({id, intent, at:absMin()+(6*60-md)+RI(5,40)}); return; }
  let t;
  if (id==="mom") t = pick(["จ้าลูก","ดูแลตัวเองนะลูก","แม่คิดถึงนะ","กินข้าวเยอะๆ"]);
  else if (id==="tana") t = intent==="status" ? (S.fails.some(f=>!f.end) ? "ยังมีไฟดับค้าง "+S.fails.filter(f=>!f.end).map(f=>f.eqId).join(", ")+" ครับ" : "ระบบปกติครับ ไม่มีเหตุค้าง") : "รับทราบครับ";
  else if (r.angry>0 && intent!=="sorry") t = pick(["…","อ่านแล้วไม่ตอบ","ยังโกรธอยู่"]);
  else switch(intent){
    case "hi": t = pick(["หวัดดี~","ว่าไง","มีอะไรเหรอ"]); break;
    case "what": t = pick(["ปิดใบงานอยู่","นอนดูซีรีส์","กินข้าวอยู่","ขับรถกลับบ้าน"]); break;
    case "eat": if (r.f>=25 && Math.random()<.4+r.f/150){ const dd = md<17*60+30?today():today()+1; if (!S.appts.some(a=>a.id===id&&!a.done)) S.appts.push({id, at:dd*1440+18*60+30, kind:p.single&&r.r>=35?"date":"meal", done:false}); t = `ไปสิ! เจอกัน 18:30 ที่ตลาด${dd===today()?"":" พรุ่งนี้"}นะ`; } else t = pick(["ไม่ว่างอะ ไว้วันหลังนะ","ติดธุระ ขอโทษน้า"]); break;
    case "work": { const w = S.wos.find(x=>x.kind==="PM" && x.status==="accepted" && !x.form);
      if (w && p.tech && r.f>=25 && Math.random()<.35+r.f/100){ let tm = S.team.find(x=>x.name===p.name); if (!tm){ tm={name:p.name,wo:null,until:0,pid:id}; S.team.push(tm);} if (!tm.wo){ tm.wo=w.code; tm.until=absMin()+RI(150,260); w.status="team"; w.teamBy=p.name; relGain(id,-3); t = `ได้ เดี๋ยวรับ ${w.code} ให้ 👍`; } else t = "มือไม่ว่างเลย ขอโทษนะ"; }
      else t = pick(["วันนี้ไม่ไหวจริงๆ","ทำไมไม่ทำเองล่ะ 😑","งานตัวเองยังไม่เสร็จเลย"]); break; }
    case "thanks": relGain(id,1); t = pick(["ยินดีเลย","สบายมาก","ไว้เลี้ยงกาแฟก็พอ ☕"]); break;
    case "sticker": relGain(id,.5); t = pick(["😂","👍","🤣","🥰","555"]); break;
    case "miss": if (r.r>=40 || r.status==="dating"){ relGain(id,1,3); t = pick(["คิดถึงเหมือนกัน 🥰","เขินนะ…","พรุ่งนี้เจอกันนะ"]); } else { relGain(id,-2,-1); t = pick(["?? ส่งผิดคนป่าว 😅","เอ่อ…"]); } break;
    case "sorry": r.angry = Math.max(0, r.angry-1); relGain(id,3); t = r.angry ? "ยังไม่หายโกรธนะ" : "อืม ไม่เป็นไรแล้ว"; break;
    default: t = "👍";
  }
  lineIn(id, t);
}
let CHATV = null;
function openLine(){
  CHATV = null;
  const ids = CHAT_IDS().sort((a,b)=>((S.chats[b]||[]).slice(-1)[0]?.at||0)-((S.chats[a]||[]).slice(-1)[0]?.at||0));
  openModal("LINE", "แชตกับเพื่อนร่วมงานและครอบครัว",
    `<div class="rows">${ids.map(id=>{ const last = (S.chats[id]||[]).slice(-1)[0]; const u = S.unread[id]||0; const st = id!=="team" && relOf(id).status==="dating" ? " ❤":"";
      return `<button class="row" style="text-align:left;background:none;color:inherit;cursor:pointer;font:inherit" data-act="chat" data-arg="${id}"><div style="min-width:0"><div class="n">${esc(chatName(id))}${st}</div><div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?esc((last.m?"คุณ: ":"")+last.t):"เริ่มแชต"}</div></div>${u?`<span class="tag fail">${u}</span>`:""}</button>`; }).join("")}</div>`,
    [{label:"กลับหน้าหลักมือถือ", fn:openPhone}]);
}
bodyActs.chat = id => { CHATV = id; S.unread[id] = 0; renderChat(); };
function quickRepliesBase(id){
  if (id==="team") return [["รับทราบ{mp} 👍","ok"],["ใครว่างช่วยรับงาน PM ให้หน่อย{mp}","help"],["ฝนตกหนัก ทุกคนขับรถระวังนะ{mp}","ok"]];
  if (id==="tana") return [["มีเหตุไฟดับค้างไหม{mp}","status"],["ซ่อมเสร็จแล้ว จ่ายไฟคืนได้{mp}","ok"]];
  if (id==="mom") return [["กินแล้ว{mp} แม่ล่ะ","hi"],["คิดถึงแม่นะ{mp}","hi"],["ไว้หยุดยาวจะกลับบ้าน{mp}","hi"]];
  const r = relOf(id), p = PP[id], q = [["หวัดดี","hi"],["ทำอะไรอยู่","what"],["เย็นนี้ไปกินข้าวด้วยกันไหม","eat"],["ขอบคุณมากนะ{mp}","thanks"],["[สติกเกอร์ หมีโบกมือ]","sticker"]];
  if (p.tech) q.push(["ฝากรับใบงาน PM สักใบได้ไหม {mp}","work"]);
  if (p.single && (r.r>=20 || r.status==="dating")) q.push(["คิดถึงนะ","miss"]);
  if (r.angry>0) q.push(["ขอโทษนะ เรื่องเมื่อกี้","sorry"]);
  return q;
}
function renderChat(){
  const id = CHATV, msgs = (S.chats[id]||[]).slice(-30);
  openModal(chatName(id), id==="team" ? "กลุ่มงาน" : PP[id].role,
    `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">${msgs.map(m=>`<div style="align-self:${m.m?"flex-end":"flex-start"};max-width:82%;background:${m.m?"#06c755":"rgba(255,255,255,.1)"};color:${m.m?"#04210f":"var(--fg)"};padding:7px 11px;border-radius:14px;font-size:14px">${esc(m.t)}<div style="font-size:10.5px;opacity:.65;text-align:right">${hhmm(m.at%1440)}</div></div>`).join("")||`<p class="soft">ยังไม่มีข้อความ</p>`}</div>
     <div style="display:flex;gap:6px;flex-wrap:wrap">${quickReplies(id).map(([t,i],k)=>`<button class="btn sm" data-act="qr" data-arg="${k}">${esc(fill(t,id==="team"?null:PP[id]))}</button>`).join("")}</div>`,
    [{label:"กลับรายการแชต", fn:openLine},{label:"ปิด", cls:"primary", fn:closeModal}]);
  const b = $("mBody"); b.scrollTop = b.scrollHeight;
}
bodyActs.qr = k => { const [t,i] = quickReplies(CHATV)[+k]; lineOut(CHATV, fill(t, CHATV==="team"?null:PP[CHATV]), i); sfx("click"); renderChat(); };

/* ---- calls ---- */
function openCalls(){
  openModal("โทรศัพท์", "รายชื่อติดต่อ", `<div class="rows">${PEOPLE.filter(p=>isActive(p.id)||S.gone[p.id]).map(p=>`<div class="row"><div><div class="n">${esc(p.name)}${S.gone[p.id]?" (ออกไปแล้ว)":""}</div><div class="s">${esc(p.role)}</div></div><button class="btn sm primary" data-act="call" data-arg="${p.id}">โทร</button></div>`).join("")}</div>`, [{label:"กลับหน้าหลักมือถือ", fn:openPhone}]);
}
bodyActs.call = id => {
  const p = PP[id], r = relOf(id), md = minOfDay();
  const asleep = (md<6*60 || md>23*60) && id!=="tana" && r.status!=="dating";
  if (asleep || r.angry>1 || (r.f<-30 && Math.random()<.7)){ sfx("ring"); openModal(`โทรหา${p.name}`, "ไม่มีผู้รับสาย", `<p>${asleep?"ดึกแล้ว คงหลับไปแล้ว":"ไม่รับสาย… อาจยังโกรธอยู่"}</p>`, [{label:"ส่ง LINE แทน", fn:()=>{ CHATV=id; renderChat(); }},{label:"ปิด", cls:"primary", fn:closeModal}]); return; }
  advance(2); openTalk(id, true);
};
function incomingCall(id, why){
  const p = PP[id]; sfx("ring");
  openModal(`📞 ${p.name} โทรมา`, why==="fail" ? "ศูนย์สั่งการระบบจำหน่าย" : p.role, `<p class="lead">${why==="fail"?"มีเหตุไฟดับต้องให้ช่างเข้าพื้นที่":why==="love"?"(ชื่อในจอเด้งพร้อมรูปหัวใจ)":"สายเรียกเข้า"}</p>`,
    [{label:"ไม่รับสาย", fn:()=>{ if (why==="love"){ relGain(id,-2,-2); } closeModal(); }},
     {label:"รับสาย", cls:"primary", fn:()=>{
       if (why==="fail"){ const f = S.fails.filter(x=>!x.end).slice(-1)[0]; openTalk("tana", true, f ? `ไฟดับที่${EQ[f.eqId].place} อุปกรณ์ ${f.eqId} คาดว่า${f.cause} ลูกค้าโทรเข้ามาเยอะ รบกวนเข้าพื้นที่ด่วนครับ` : "เหตุคลี่คลายแล้วครับ ขอบคุณครับ"); }
       else openTalk(id, true, why==="love" ? pick(["แค่อยากได้ยินเสียง…","ว่างไหม คุยด้วยหน่อย"]) : why==="mom" ? pick(["ลูก กินข้าวหรือยัง","แม่เพิ่งทำแกงไว้ คิดถึงลูกจัง"]) : null);
     }}]);
}

/* ---- dates & meals ---- */
function checkAppts(){
  for (const a of S.appts){
    if (a.done) continue;
    const near = Math.hypot(S.px-MKT.x, S.pz-MKT.z) < 30;
    if (a.kind==="party" && !isActive("chan")){ a.done = true; continue; }
    if (near && absMin()>=a.at-20 && absMin()<=a.at+60 && $("modal").hidden){ a.done = true; if (a.kind==="party") partyEvent(a); else dateEvent(a); return; }
    if (absMin() > a.at+60){ a.done = true; if (a.kind==="party"){ missParty(); continue; } relGain(a.id,-8,-8); relOf(a.id).angry++; lineIn(a.id, pick(["รออยู่ตั้งนาน ทำไมไม่มา 😢","เทกันแบบนี้เลยเหรอ","ไม่มาก็บอกกันหน่อยสิ"])); }
  }
  S.appts = S.appts.filter(a=>!a.done || absMin()-a.at < 1440);
}
function dateEvent(a){
  const p = PP[a.id], r = relOf(a.id), isDate = a.kind==="date";
  const late = absMin()-a.at; if (late>15) relGain(a.id,-3);
  const look = (S.outfit==="date"?6:S.outfit==="sleep"?-6:0) + (S.hygiene<35?-8:S.hygiene>80?3:0);
  const shops = [["ส้มตำไก่ย่างริมทาง",120],["หมูกระทะบุฟเฟ่ต์",199],["ร้านอาหารริมแม่น้ำเจ้าพระยา",350]];
  openModal(isDate ? `เดทกับ${p.name}` : `กินข้าวเย็นกับ${p.name}`, `ตลาดบางพลี ${hhmm(minOfDay())}${late>15?" · คุณมาสาย":""}`,
    portrait(p) + `<p>${p.name}${late>15?"ทำหน้างอนิดหน่อยที่รอนาน แต่ก็ยิ้มทักทาย":"ยืนรออยู่หน้าตลาด ยิ้มทักทาย"} ${S.outfit==="date"?"และชมว่าวันนี้แต่งตัวดี":S.outfit==="uniform"?"“มาทั้งชุดทำงานเลยเหรอ”":S.outfit==="sleep"?"“…นี่ใส่ชุดนอนมาเหรอ”":""}</p><p>จะพาไปกินที่ไหนดี</p>
     <div class="rows">${shops.map((s,i)=>`<button class="btn" style="text-align:left" data-act="dshop" data-arg="${i}">${s[0]} · ${fmtB(s[1])}</button>`).join("")}</div>`, []);
  bodyActs.dshop = i => {
    const [nm, cost] = shops[+i]; if (!spend(cost, `${nm} กับ${p.name}`)) return;
    advance(70); S.hunger = clamp(S.hunger+50,0,100); S.stress = clamp(S.stress-12,0,100);
    const ks = Object.keys(TOPICS).sort(()=>Math.random()-.5).slice(0,3); if (!ks.some(k=>p.likes.includes(k))) ks[0]=pick(p.likes);
    openModal(nm, `กับ${p.name}`, `<p>อาหารมาเสิร์ฟแล้ว บรรยากาศดี เลือกเรื่องคุยระหว่างกิน</p><div class="rows">${ks.map(k=>`<button class="btn" style="text-align:left" data-act="dtalk" data-arg="${k}|${+i}">“${TOPICS[k]}”</button>`).join("")}</div>`, []);
  };
  bodyActs.dtalk = arg => {
    const [k, si] = arg.split("|"), like = p.likes.includes(k), dis = p.dislikes.includes(k);
    const gainF = (like?8:dis?-3:3) + (+si) + look/2, gainR = isDate ? (like?10:dis?-2:4) + (+si)*3 + look : 0;
    relGain(a.id, gainF, gainR);
    const res = like ? `คุยกันถูกคอมาก ${TOPIC_LIKE[k]}` : dis ? "อีกฝ่ายดูเบื่อๆ กับเรื่องนี้ บรรยากาศเงียบไปพักหนึ่ง" : "คุยกันเพลินๆ หัวเราะกันหลายรอบ";
    openModal(isDate?"จบเดท":"กินข้าวเสร็จแล้ว", `กับ${p.name}`, `<p>${esc(res)}</p><p>${isDate ? (r.r>=60 ? `ก่อนแยกกัน ${p.name}จับมือเบาๆ “วันนี้มีความสุขมากเลย”` : `${p.name}โบกมือลา “ขอบคุณนะ วันนี้สนุกดี”`) : `${p.name}: “ไว้ไปกันอีกนะ”`}</p>${relBars(a.id)}`, [{label:"กลับ", cls:"primary", fn:closeModal}]);
    if (isDate) lineIn(a.id, pick(["ถึงบ้านแล้วบอกด้วยนะ 🥰","วันนี้ขอบคุณนะ ฝันดี","ไว้ไปกันอีกนะ"]), true);
    save();
  };
}

function partKey(txt){
  txt = String(txt);
  if (/ขดลวด|เปลี่ยนลูก|หม้อแปลงวงจรตาข่ายสำรอง/.test(txt)) return "tr";
  if (/พัดลม|อุณหภูมิ/.test(txt)) return "fan";
  if (/SF6/.test(txt)) return "sf6";
  if (/แบต|UPS/.test(txt)) return "battery";
  if (/กับดักฟ้าผ่า|L\/A/.test(txt)) return "arrester";
  if (/Bushing|บุชชิ่ง/.test(txt)) return "bushing";
  if (/ลูกถ้วย|Insulator/.test(txt)) return "insulator";
  if (/น้ำมัน|ตัวถัง|รั่ว|ปะเก็น|ความชื้น|น้ำเข้า/.test(txt)) return "gasket";
  if (/Fuse|ฟิวส์/.test(txt)) return "fuse";
  return "connector";
}

function repStepDone(mins){

let MG = null;

/* LOTO ordering */
const LOTO_STEPS = [
  ["แจ้งศูนย์สั่งการ ขอ Switching Order ปลดวงจร","ต้องได้รับอนุญาตจากศูนย์สั่งการก่อน ไม่งั้นอาจมีคนสับไฟเข้ามา"],
  ["สวม PPE: ถุงมือยาง 1000V หมวก แว่นนิรภัย เข็มขัดนิรภัย","ต้องสวมก่อนเข้าใกล้อุปกรณ์ที่อาจมีไฟ"],
  ["ปลด Drop Fuse / สวิตช์ตัดตอน ด้วยไม้ชักฟิวส์","ตัดแหล่งจ่ายให้เห็นจุดเปิดวงจรชัดเจน"],
  ["คล้องกุญแจ (Lock-out) แขวนป้าย “ห้ามสับ มีคนทำงาน” (Tag-out)","ล็อกจุดที่ปลดไว้ทันที กันคนอื่นสับกลับ"],
  ["ทดสอบไม่มีแรงดันด้วย Voltage Detector (เช็กเครื่องกับแหล่งไฟก่อน)","ห้ามเชื่อว่าไม่มีไฟจนกว่าจะวัดเอง"],
  ["ต่อสายดินชั่วคราวลัดวงจรทั้ง 3 เฟส (ต่อฝั่งดินก่อน)","ต่อดินหลังทดสอบแล้วเท่านั้น เป็นขั้นสุดท้ายก่อนลงมือ"],
];
function startLoto(){ MG = {t:"loto", order:LOTO_STEPS.map((_,i)=>i).sort(()=>Math.random()-.5), done:[], err:0, msg:"แตะขั้นตอนตามลำดับที่ถูกต้องตามคู่มือ SW-OH"}; renderLoto(); }
function renderLoto(){
  const nx = MG.done.length;
  openModal("ตัดแยกพลังงาน (LOTO)", `${REP.eq.id} · ทำผิด ${MG.err} ครั้ง`,
    `${MG.done.length?`<div class="steps">${MG.done.map((i,k)=>`<div class="step done"><div class="i">${k+1}</div><div>${esc(LOTO_STEPS[i][0])}</div><div><span class="ok">✓</span></div></div>`).join("")}</div>`:""}
     <p class="${MG.bad?"bad":"soft"}" style="margin:10px 0">${esc(MG.msg)}</p>${hintBy()}
     <div class="rows">${MG.order.filter(i=>!MG.done.includes(i)).map(i=>`<button class="btn" style="text-align:left;${S.partner&&i===nx?"border-color:#ffd84d":""}" data-act="loto" data-arg="${i}">${esc(LOTO_STEPS[i][0])}</button>`).join("")}</div>`,
    [{label:"พักงานไว้ก่อน", fn:closeModal}]);
}
bodyActs.loto = v => {

      else toast(e ? `LOTO ครบ (ผิด ${e} ครั้ง)` : "LOTO ถูกต้องครบทุกขั้น ปลอดภัย 100%", e?"":"good");

/* torque sequence (star pattern, 2 passes) */
const TORQ = {gasket:25, bushing:40, insulator:35, connector:30, arrester:30};
function startTorque(){
  const k = REP.pk, n = k==="connector"||k==="arrester" ? 4 : 8;
  MG = {t:"tq", n, spec:TORQ[k]||30, pass:0, seq:[], set:null, err:0, msg:`ขันน็อต ${n} ตัวแบบไขว้ (ลายดาว) 2 รอบ: รอบแรก 50% ของแรงบิด รอบสอง 100%`};
  renderTorque();
}
function tqNext(){
  const {seq, n} = MG, k = seq.length, h = n/2;
  if (k===0) return null;
  if (k%2===1) return [(seq[k-1]+h)%n];
  if (n===8 && k===2) return [(seq[0]+2)%8, (seq[0]+6)%8];
  return null;
}
function renderTorque(){
  const {n, spec, pass} = MG, opts = [spec/2, spec, Math.round(spec*1.5)], nxt = tqNext(), R0 = 92;
  const bolts = Array.from({length:n},(_,i)=>{ const a = i/n*Math.PI*2 - Math.PI/2, x = 120+Math.cos(a)*R0, y = 120+Math.sin(a)*R0, k = MG.seq.indexOf(i), hint = S.partner && nxt && nxt.includes(i);
    return `<button data-act="bolt" data-arg="${i}" aria-label="น็อตตัวที่ ${i+1}" style="position:absolute;left:${x-21}px;top:${y-21}px;width:42px;height:42px;border-radius:50%;border:3px solid ${hint?"#ffd84d":"#8a96a3"};background:${k>=0?"#2fa36b":"#3a4652"};color:#fff;font:700 14px var(--display);cursor:pointer">${k>=0?k+1:"⬢"}</button>`; }).join("");
  openModal(`ขันน็อตตามลำดับแรงบิด · รอบ ${pass+1}/2`, `${PARTS[REP.pk].n} · สเปก ${spec} N·m · ผิด ${MG.err} ครั้ง`,
    `<p>ตั้งประแจทอร์ก: ${opts.map(v=>`<button class="btn sm ${MG.set===v?"primary":""}" data-act="tqset" data-arg="${v}">${v} N·m</button>`).join(" ")}</p>
     <div style="position:relative;width:240px;max-width:100%;height:240px;margin:12px auto;border-radius:50%;background:radial-gradient(circle,#1d252e 0 46px,#56616c 47px 72px,#2a333d 73px)">${bolts}</div>
     <p class="${MG.bad?"bad":"soft"}">${esc(MG.msg)}</p>${hintBy()}`,
    [{label:"พักงานไว้ก่อน", fn:closeModal}]);
}
bodyActs.tqset = v => { MG.set = +v; MG.bad = false; MG.msg = `ตั้งประแจไว้ ${v} N·m`; sfx("click"); renderTorque(); };
bodyActs.bolt = v => {
  const i = +v, want = MG.pass===0 ? MG.spec/2 : MG.spec;
  if (MG.seq.includes(i)) return;
  if (MG.set==null){ MG.bad = true; MG.msg = "ตั้งค่าแรงบิดที่ประแจก่อน"; return renderTorque(); }
  if (MG.set!==want){
    MG.err += MG.set>want ? 2 : 1; MG.bad = true; sfx("bad");
    MG.msg = MG.set>want ? `แรงบิดเกิน! รอบนี้ต้องใช้ ${want} N·m — ขันแรงเกินเสี่ยงปะเก็นแตก/บุชชิ่งร้าว` : `แรงบิดน้อยไป รอบนี้ต้องใช้ ${want} N·m`;
    MG.set = null; return renderTorque();

let CR = null;
const CRK = {arrowleft:"l", a:"l", arrowright:"r", d:"r", arrowup:"u", w:"u", arrowdown:"d", s:"d"};

     <p class="soft" style="margin-top:8px">ลูกศร/WASD หรือกดปุ่มค้าง · ค่อยๆ เลื่อนให้แกว่งน้อย วางตรงฐานช้าๆ · ห้ามชนบุชชิ่งของอุปกรณ์ข้างเคียง</p>`,

function craneStep(dt){
  const K = CR.keys, acc = (K.has("r")?1:0) - (K.has("l")?1:0), pv = CR.vx;
  CR.vx = clamp((CR.vx + acc*170*dt) * Math.pow(.2, dt), -110, 110);
  CR.cx = clamp(CR.cx + CR.vx*dt, 40, 520);
  const a = (CR.vx - pv) / Math.max(dt, 1e-3);
  if (K.has("d")) CR.L = Math.min(CR.L + 55*dt, 210);
  if (K.has("u")) CR.L = Math.max(CR.L - 75*dt, 30);
  CR.w += (-(600/CR.L)*Math.sin(CR.th) - (a/CR.L)*Math.cos(CR.th)) * dt; CR.w *= Math.pow(.55, dt); CR.th += CR.w*dt;
  const lx = CR.cx + CR.L*Math.sin(CR.th), ly = 30 + CR.L*Math.cos(CR.th);
  const box = {x:lx-32, y:ly+8, w:64, h:52}; CR.box = box; CR.lx = lx;
  CR.cd -= dt; CR.mcd = (CR.mcd||0) - dt;
  for (const o of CR.obs){
    if (box.x < o.x+o.w && box.x+box.w > o.x && box.y < o.y+o.h && box.y+box.h > o.y){
      if (CR.cd<=0){ CR.hits++; CR.cd = .9; sfx("bad"); CR.msg = "💥 ชนบุชชิ่ง! ระวังแตกร้าว"; CR.w += (lx < o.x+o.w/2 ? -1 : 1) * 1.1; }
      CR.L = Math.max(30, CR.L - 90*dt);
    }
  }
  const padTop = 250;
  if (box.y + box.h >= padTop){
    const off = Math.abs(lx - CR.padX), calm = Math.abs(CR.th) < .07 && Math.abs(CR.w) < .3;
    if (off < 15 && calm) return true;
    CR.L -= 36; if (CR.mcd<=0){ CR.miss++; CR.mcd = 1.5; sfx("bad"); }
    CR.msg = off >= 15 ? `ไม่ตรงฐาน (เยื้อง ${Math.round(off/6)} ซม.) ยกขึ้นปรับใหม่` : "ยังแกว่งอยู่ รอให้นิ่งก่อนวาง";
  }
  return false;
}
function drawCrane(){

  g.fillStyle = "#3a3f36"; g.fillRect(0,262,W,H-262);
  g.fillStyle = "#9aa1a6"; g.fillRect(CR.padX-46, 250, 92, 12); g.fillStyle = "#c9cfd3"; g.fillRect(CR.padX-2, 244, 4, 6);
  g.fillStyle = "#5b6670"; g.fillRect(CR.padX-128, 170, 70, 92); g.fillStyle = "#7f8b95"; g.fillRect(CR.padX-128, 170, 70, 6);
  g.fillStyle = "#8b6b4a"; g.fillRect(CR.padX+138, 60, 12, 202); g.fillStyle = "#6c757d"; g.fillRect(CR.padX+50, 146, 112, 8);
  for (const o of CR.obs){ for (let y=o.y; y<o.y+o.h; y+=7){ g.fillStyle = (Math.floor((y-o.y)/7)%2) ? "#c7b9a3" : "#8c4a2f"; g.fillRect(o.x-2, y, o.w+4, 5); } g.fillStyle = "#ddd"; g.fillRect(o.x+o.w/2-1.5, o.y-6, 3, 6); }
  g.fillStyle = "#e0a330"; g.fillRect(0, 14, W, 10); g.fillStyle = "#333"; for (let x=0;x<W;x+=24){ g.fillRect(x,14,10,10); }
  g.fillStyle = "#f2c94c"; g.fillRect(CR.cx-14, 22, 28, 10);

function craneLoop(now){

function promoScore(){
  const P = S.promo, s0 = P.start*1440, notes = {pm:0, late:0, correct:0, cm:0, fast:0};
  let me = 0;
  S.wos.filter(w=>w.status==="done" && !w.byTeam && w.doneAt>=s0).forEach(w=>{
    if (w.kind==="PM"){ notes.pm++; me += w.late ? -2 : 3; if (w.late) notes.late++; if (w.correct){ me += 2; notes.correct++; } }
    else { notes.cm++; me += 3; if (w.fail){ const f = S.fails.find(x=>x.id===w.fail); if (f && f.end && f.end-f.start<=240){ me += 3; notes.fast++; } } }
  });
  const acc = S.stats.accidents - P.acc0; me += -acc*6 + Math.round(relOf("boss").f/10) + (P.bonus||0);
  return {me, ton:Math.round(P.ton), notes, acc};
}

function storyHour(hAbs){
  const hr = hAbs%24, d = Math.floor(hAbs/24), wd = !isWeekend(d), st = S.story;
  if (hr===0 && dateOf(d).getDate()===1) S.budget = 30000;

  S.redo = S.redo.filter(r=>{ if (absMin()>=r.at){ redoFail(r); return false; } return true; });
  if (wd && hr===9 && Math.random()<.5 && isActive("namfon")){
    const out = Object.keys(PARTS).filter(k=>!S.stock[k] && !S.orders.some(o=>o.k===k));
    if (out.length) lineIn("namfon", `แจ้งเตือนสต็อก: ${out.map(k=>PARTS[k].n).join(", ")} หมดคลังแล้วนะ ถ้าจะใช้ต้องสั่งพี่แอนล่วงหน้า`);
  }
  // Uncle Chan retires
  if (!st.chanAnn && d>=1 && wd && hr===9 && isActive("chan")){
    st.chanAnn = true; let pd = d+5; while (dateOf(pd).getDay()!==5) pd++; st.partyDay = pd;
    S.appts.push({id:"chan", kind:"party", at:pd*1440+18*60, done:false});
    lineIn("team", `หัวหน้าประเสริฐ: ลุงชาญจะเกษียณสิ้นเดือนนี้ เลี้ยงส่ง${fmtDay(pd)} 18:00 ที่ตลาดบางพลี ใครร่วมลงขันของขวัญตอบในกลุ่มได้เลยครับ`, true);
    if (!sleeping) toast(`ลุงชาญจะเกษียณ — งานเลี้ยงส่ง ${fmtDay(pd)} 18:00 ที่ตลาด`, "good");
  }
  if (st.partyDay===d && hr===12 && !st.chanDone) lineIn("chan", "เย็นนี้หกโมงเจอกันที่ตลาดนะ ลุงรออยู่ 😊");
  // Beer's child
  if (!st.beer && d>=4 && wd && hr===7 && isActive("beer")){ st.beer = 1; S.pending.push({type:"story", k:"beerSick"}); }
  if (st.beer===1 && st.beerLeave!=null && d>st.beerLeave && wd && hr===8){
    st.beer = 2;
    if (st.beerHelp){ S.inv.snack += 2; relGain("beer",5); lineIn("beer", "กลับมาทำงานแล้วนะ ลูกหายดีแล้ว 🙏 เอาขนมมาฝากวางไว้ที่โต๊ะ ขอบคุณที่ช่วยรับงานแทนนะ"); }
    else lineIn("team", "เบียร์: กลับมาทำงานแล้วค่ะ ลูกหายดีแล้ว ขอบคุณทุกคนที่เป็นห่วง", true);
  }
  // promotion race
  if (!S.promo && d>=6 && wd && hr===9 && S.level<2 && isActive("ton")){
    let end = d+7; while (isWeekend(end)) end++;
    S.promo = {start:d, end, ton:0, acc0:S.stats.accidents, stage:1, bonus:0};
    S.pending.push({type:"story", k:"promoAnn"});
  }
  const P = S.promo;
  if (P && P.stage===1){
    if (wd && hr===17){ P.ton += RI(6,11) + (relOf("ton").f>=40?1:0); if (Math.random()<.5) lineIn("team", `ต้น: วันนี้ปิดไป ${RI(2,4)} ใบ 😎 ใครจะตามทัน`, true); }
    if (!P.sab && relOf("ton").f < 0 && wd && hr===10 && Math.random()<.4){
      const w = S.wos.find(x=>x.kind==="PM" && x.status==="accepted" && !x.form);
      if (w){ P.sab = true; P.ton += 4; w.status = "team"; w.teamBy = "ต้น"; S.team.push({name:"ต้น", wo:w.code, until:absMin()+RI(120,200), pid:"ton"}); lineIn("team", `ต้น: ใบงาน ${w.code} ผมจัดการให้แล้วนะ ไม่ต้องขอบคุณ 😏`, true); if (!sleeping) toast(`ต้นแย่งรับใบงาน ${w.code} ที่คุณรับไว้ไปทำเอง`, "bad"); }
    }
    if (d>=P.end && hr===10) S.pending.push({type:"story", k:"promoDecide"});
  }
  // resignations after serious fallouts
  if (wd && hr===17) PEOPLE.forEach(p=>{
    if (!isActive(p.id) || p.remote || ["boss","dang","ann"].includes(p.id)) return;
    const r = relOf(p.id); if ((r.f <= -55 || r.angry>=3) && Math.random()<.3) S.pending.push({type:"story", k:"resign", id:p.id});
  });
  if (st.hireQ && st.hireQ.length && wd && hr===8 && d>=st.hireQ[0]){ st.hireQ.shift(); hireNew(); }
  if (st.chanDone && hr===19 && Math.random()<.04) lineIn("chan", pick(["วันนี้ไปตกปลาที่บางปูมา ได้ปลากะพงตัวเบ้อเริ่ม 🎣","เป็นไงบ้าง งานหนักไหม อย่าลืมต่อสายดินนะ","หลานลุงเพิ่งเข้า ป.1 วันนี้ 😊"]));

/* ---- sound: transformer hum, thunder, trip alarm, music by time of day ---- */
let FLASH = 0;
function audioInit(){
  audioInitBase(); if (!AU.ctx || AU.hum) return;
  const C = AU.ctx;
  AU.hum = C.createGain(); AU.hum.gain.value = 0; AU.hum.connect(AU.master);
  [[100,.6],[200,.28],[300,.12],[400,.05]].forEach(([f,v])=>{ const o = C.createOscillator(), g = C.createGain(); o.frequency.value = f; g.gain.value = v; o.connect(g).connect(AU.hum); o.start(); });
  AU.mus = C.createGain(); AU.mus.gain.value = 0; AU.mus.connect(AU.master);
  const nb = C.createBuffer(1, C.sampleRate*3, C.sampleRate), nd = nb.getChannelData(0); for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1; AU.nbuf = nb;
  AU.next = C.currentTime + .3; AU.step = 0;
}
function audioTick(){
  audioTickBase(); if (!AU.ctx || !AU.hum) return;
  const t = AU.ctx.currentTime, h = minOfDay()/60;
  let best = 1e9;
  for (const e of EQUIP){ if (activeFail(e.id)) continue; const d = Math.hypot(e.x-S.px, e.z-S.pz) * (/transformer|substation/.test(e.type) ? 1 : 1.7); if (d<best) best = d; }
  AU.hum.gain.setTargetAtTime(S.sound && best<26 ? .08*Math.pow(1-best/26,2) : 0, t, .3);
  const on = S.sound && S.music;
  AU.mus.gain.setTargetAtTime(on ? (h>=22||h<6 ? .55 : .85) * (S.rain>0 ? .6 : 1) : 0, t, .8);
  if (on) musicTick(t, h); else AU.next = t + .2;
}
function thunder(at){
  const C = AU.ctx, s = C.createBufferSource(); s.buffer = AU.nbuf;
  const f = C.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 150;
  const g = C.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.6, at+.06); g.gain.exponentialRampToValueAtTime(.001, at+2.8);
  s.connect(f).connect(g).connect(AU.master); s.start(at); s.stop(at+3);
}
const MUS = {
  morning:{root:60, scale:[0,2,4,7,9], prog:[0,5,7,5], step:.26, wave:"triangle", vol:.045, minor:false},
  noon:{root:55, scale:[0,2,4,7,9], prog:[0,-2,5,0], step:.32, wave:"sine", vol:.045, minor:false},
  evening:{root:57, scale:[0,3,5,7,10], prog:[0,-4,-2,0], step:.42, wave:"sine", vol:.045, minor:true},
  night:{root:50, scale:[0,3,7,10,14], prog:[0,-4,3,-2], step:.7, wave:"sine", vol:.03, minor:true},
};
const midiF = n => 440*Math.pow(2,(n-69)/12);
function mnote(n, at, dur, type, vol){ const C = AU.ctx, o = C.createOscillator(), g = C.createGain(); o.type = type; o.frequency.value = midiF(n); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at+.02); g.gain.exponentialRampToValueAtTime(.0008, at+dur); o.connect(g).connect(AU.mus); o.start(at); o.stop(at+dur+.05); }
function musicTick(t, h){
  const M = h>=5.5&&h<11 ? MUS.morning : h>=11&&h<17 ? MUS.noon : h>=17&&h<20.5 ? MUS.evening : MUS.night;
  if (AU.next < t) AU.next = t + .05;
  while (AU.next < t + .3){
    const s = AU.step++, bar = Math.floor(s/8)%4, beat = s%8, root = M.root + M.prog[bar], at = AU.next;
    if (beat===0) [0,7,M.minor?15:16].forEach(iv=>mnote(root-12+iv, at, M.step*7.5, "sine", M.vol*.45));
    if (beat===0 || beat===4) mnote(root-24, at, M.step*2.5, "triangle", M.vol*.8);
    if (Math.random() < (M===MUS.night ? .3 : .55)) mnote(root + 12 + M.scale[(s*3 + RI(0,2)) % M.scale.length], at, M.step*1.5, M.wave, M.vol);
    AU.next += M.step;
  }
}
function sfx(kind){
  if (kind==="trip"){
    if (!AU.ctx || !S.sound) return; const C = AU.ctx, t0 = C.currentTime;
    for (let i=0;i<6;i++){ const o = C.createOscillator(), g = C.createGain(), a = t0+i*.22; o.type = "square"; o.frequency.value = i%2 ? 660 : 990; g.gain.setValueAtTime(0,a); g.gain.linearRampToValueAtTime(.055,a+.01); g.gain.setValueAtTime(.055,a+.17); g.gain.linearRampToValueAtTime(0,a+.2); o.connect(g).connect(AU.master); o.start(a); o.stop(a+.22); }
    return;
  }
  sfxBase(kind);
}
function weatherFx(dt){
  if (S.rain>0 && !paused && FLASH<=0 && Math.random() < dt*.045){ FLASH = 1; if (AU.ctx && S.sound && AU.nbuf) thunder(AU.ctx.currentTime + R(.3,2.4)); }
  if (FLASH>0){ hemi.intensity += FLASH*1.5; if (scene.background && scene.background.isColor) scene.background.offsetHSL(0,0,FLASH*.3); FLASH = Math.max(0, FLASH - dt*3.5); }
}

bodyActs.music = () => { S.music = !S.music; save(); bodyActs["app-set"](); };

/* ---- phone (CMMS) ---- */
function kpis(){
  const t = dateOf(today()), y = t.getFullYear(), m = t.getMonth();
  const inM = d => { const x = dateOf(d); return x.getFullYear()===y && x.getMonth()===m; };
  const inMa = a => inM(dayOf(a));
  const pm = S.wos.filter(w=>w.kind==="PM" && inM(w.due));
  const done = pm.filter(w=>w.status==="done").length, over = pm.filter(isLate).length;
  const rep = S.fails.filter(f=>f.end && inMa(f.end)), mttr = rep.length ? rep.reduce((s,f)=>s+(f.end-f.start)/60,0)/rep.length : null;
  const fc = S.fails.filter(f=>inMa(f.start)).length;
  return { label:`${TH_MF[m]} ${y+543}`, total:pm.length, done, over, comp: pm.length?done/pm.length*100:null, ovr: pm.length?over/pm.length*100:null, mttr, fc, rep:rep.length };
}

// two-finger pinch zoom on touch screens
const PTR = new Map(); let pinchD = 0;
const pinchPts = () => { const [a,b] = [...PTR.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };

/* ================= movement & physics ================= */
const P = {vx:0, vz:0, face:0, walk:0, v:0};
function collide(x, z, r){
  for (const c of COL){
    if (x>c.x0-r && x<c.x1+r && z>c.z0-r && z<c.z1+r){
      const dl = x-(c.x0-r), dr = (c.x1+r)-x, du = z-(c.z0-r), dd = (c.z1+r)-z, m = Math.min(dl,dr,du,dd);
      if (m===dl) x = c.x0-r; else if (m===dr) x = c.x1+r; else if (m===du) z = c.z0-r; else z = c.z1+r;
    }
  }
  return [clamp(x,-174,174), clamp(z,-174,174)];
}
let bumpCD = 0;
function bumpTraffic(x, z, r){
  bumpCD -= 1/60;
  if (Math.abs(P.v) < 6 || bumpCD > 0) return;
  for (const c of cars){ if (Math.hypot(c.g.position.x-x, c.g.position.z-z) < r+1.2){
    bumpCD = 2.5; const hard = Math.abs(P.v) > 14; P.v *= -.25; sfx("bad");
    const cost = hard ? 600 : 250; S.money -= cost; S.log.unshift({t:absMin(), n:-cost, why:"ค่าเสียหายรถชนกัน"}); S.stress = clamp(S.stress+(hard?12:5),0,100);
    toast(hard ? `โครม! ชนรถคันอื่นแรง จ่ายค่าเสียหาย ฿${cost}` : `เฉี่ยวรถคันหน้า จ่ายค่าเสียหาย ฿${cost}`, "bad"); return; } }
}
function toggleTruck(){
  if (!$("modal").hidden) return;
  if (S.onBike){ S.onBike = false; [S.px,S.pz] = collide(S.bx + Math.cos(S.bh)*1.2, S.bz - Math.sin(S.bh)*1.2, .5); P.v=0; return; }
  if (!S.inTruck && Math.hypot(S.px-S.bx, S.pz-S.bz) < 3.5 && Math.hypot(S.px-S.bx, S.pz-S.bz) < Math.hypot(S.px-S.tx, S.pz-S.tz)){ S.onBike = true; P.v = 0; toast("ขี่มอเตอร์ไซค์ · กด H บีบแตร"); return; }

    const sx = S.tx + Math.cos(S.th)*2.4, sz = S.tz - Math.sin(S.th)*2.4;

  } else {
    if (Math.hypot(S.px-S.tx, S.pz-S.tz) > 5){ toast("ต้องอยู่ใกล้รถกระเช้าก่อน"); return; }
    S.inTruck = true;
  }
}
function interact(){

}
let near = null;

function update(dt){
  // input
  let ix=0, iy=0;
  if (keys.has("w")||keys.has("arrowup")) iy+=1;
  if (keys.has("s")||keys.has("arrowdown")) iy-=1;
  if (keys.has("a")||keys.has("arrowleft")) ix-=1;
  if (keys.has("d")||keys.has("arrowright")) ix+=1;
  if (touch && (joy.x||joy.y)){ ix += joy.x; iy -= joy.y; }
  const tired = S.energy < 15 ? .55 : 1;

  if (S.inTruck){
    let throttle = clamp(iy,-1,1); const steer = clamp(ix,-1,1);
    if (S.fuel<=0){ throttle = 0; if (!fuelWarned){ fuelWarned = true; outOfFuel(); } } else fuelWarned = false;
    const svcLate = today() > S.svcDue, wet = S.rain>0, flood = inFlood(S.tx,S.tz);
    let vmax = 26*tired*(svcLate?.65:1)*(flood?.35:1);
    if (svcLate && Math.random()<dt*.15 && Math.abs(P.v)>5){ P.v *= .5; toast("เครื่องยนต์สะดุด — ถึงรอบเข้าอู่บำรุงรักษารถแล้ว", "bad"); }
    P.v += throttle * 16 * dt; P.v *= Math.pow(.6, dt); P.v = clamp(P.v, -7, vmax);
    if (Math.abs(throttle)<.05) P.v *= Math.pow(wet?.5:.25, dt);
    S.th -= steer * clamp(P.v/9, -1, 1) * (wet?1.15:1.6) * dt;
    S.fuel = Math.max(0, S.fuel - Math.abs(P.v)*dt*.022);
    let nx = S.tx + Math.sin(S.th)*P.v*dt, nz = S.tz + Math.cos(S.th)*P.v*dt;
    const [cx,cz] = collide(nx, nz, 2.2); if (cx!==nx||cz!==nz) P.v *= .3;
    S.tx = cx; S.tz = cz; S.px = cx; S.pz = cz;
    let want = S.th + Math.PI, d = ((want - camYaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
    if (!drag) camYaw += d * Math.min(1, dt*2.2);

  } else if (S.onBike){
    const throttle = clamp(iy,-1,1), steer = clamp(ix,-1,1), wet = S.rain>0;
    let vmax = 21*tired*(inFlood(S.bx,S.bz)?.3:1);
    P.v += throttle * 15 * dt; P.v *= Math.pow(.65, dt); P.v = clamp(P.v, -4, vmax);
    if (Math.abs(throttle)<.05) P.v *= Math.pow(wet?.45:.2, dt);
    S.bh -= steer * clamp(P.v/6, -1, 1) * (wet?1.6:2.3) * dt;
    if (wet && Math.abs(steer)>.5 && P.v>15 && Math.random()<dt*.3){ P.v*=.3; S.energy=clamp(S.energy-6,0,100); S.stress=clamp(S.stress+4,0,100); toast("ถนนลื่น! รถเสียหลักเกือบล้ม", "bad"); }
    let nx = S.bx + Math.sin(S.bh)*P.v*dt, nz = S.bz + Math.cos(S.bh)*P.v*dt;
    const [cx,cz] = collide(nx, nz, .8); if (cx!==nx||cz!==nz) P.v *= .3;
    S.bx = cx; S.bz = cz; S.px = cx; S.pz = cz;
    let want = S.bh + Math.PI, d = ((want - camYaw + Math.PI*3) % (Math.PI*2)) - Math.PI;

  } else {

  bike.position.set(S.bx, 0, S.bz); bike.rotation.y = S.bh; bike.rotation.z = S.onBike ? clamp(-P.v*.012*(keys.has("a")||joy.x<-.3?-1:keys.has("d")||joy.x>.3?1:0),-.25,.25) : 0;
  let df = ((P.face - player.rotation.y + Math.PI*3)%(Math.PI*2))-Math.PI; player.rotation.y += df*Math.min(1,dt*12);
  truck.position.set(S.tx, 0, S.tz); truck.rotation.y = S.th;

  // camera
  const tx = S.px, tz = S.pz, ty = S.inTruck?2.4:1.7, dist = S.inTruck?Math.max(camDist,16):S.onBike?Math.max(camDist,10):camDist;
  camera.position.set(tx + Math.sin(camYaw)*Math.cos(camPitch)*dist, ty + Math.sin(camPitch)*dist, tz + Math.cos(camYaw)*Math.cos(camPitch)*dist);
  camera.lookAt(tx, ty, tz);

  // traffic
  cars.forEach(c => {
    c.t += c.dir*c.sp*dt; if (c.t>178) c.t=-178; if (c.t<-178) c.t=178;
    const lane = c.road + c.dir*3;
    if (c.v){ c.g.position.set(lane, 0, c.t); c.g.rotation.y = c.dir>0?0:Math.PI; }
    else { c.g.position.set(c.t, 0, c.road - c.dir*3); c.g.rotation.y = c.dir>0?Math.PI/2:-Math.PI/2; }
  });
  peds.forEach(p => {
    const g=p.g; if (p.wait>0){ p.wait-=dt; return; }
    const dx=p.tgt.x-g.position.x, dz=p.tgt.z-g.position.z, l=Math.hypot(dx,dz);
    if (l<.3){ p.tgt={x:p.home.x+R(-10,10), z:p.home.z+R(-5,5)}; p.wait=R(1,5); return; }
    g.position.x+=dx/l*1.6*dt; g.position.z+=dz/l*1.6*dt; g.rotation.y=Math.atan2(dx,dz);
  });
  if (!peds[0].init){ peds.forEach(p=>{ p.g.position.set(p.home.x,0,p.home.z); }); peds[0].init=true; }

  // nearest interaction
  near = null; let bd = 1e9;
  for (const p of INTER){ const d = Math.hypot(p.x-S.px, p.z-S.pz); if (d<p.r && d<bd){ bd=d; near=p; } }
  if (!S.inTruck && !S.onBike) for (const n of NPCS){ if (!n.vis) continue; const d = Math.hypot(n.x-S.px, n.z-S.pz); if (d<2.8 && d<bd+1.5){ bd=d; const id=n.p.id; near = {x:n.x, z:n.z, label:()=> (S.argue && (S.argue.a===id||S.argue.b===id)) ? `ห้าม${PP[id].name}ที่กำลังเถียงกัน` : `คุยกับ${PP[id].name}${relOf(id).status==="dating"?" ❤":""}`, act:()=>openTalk(id)}; } }
  const pr = $("prompt"), veh = S.inTruck||S.onBike;
  if (near && $("modal").hidden){ pr.hidden=false; pr.innerHTML = veh && !near.car ? `${esc(near.label())} · กด <kbd>F</kbd> ลงจากรถก่อน` : `<kbd>E</kbd> ${esc(near.label())}`; }
  else if (!veh && Math.hypot(S.px-S.tx,S.pz-S.tz)<5 && $("modal").hidden){ pr.hidden=false; pr.innerHTML = `<kbd>F</kbd> ขึ้นรถกระเช้า`; }
  else if (!veh && Math.hypot(S.px-S.bx,S.pz-S.bz)<3.5 && $("modal").hidden){ pr.hidden=false; pr.innerHTML = `<kbd>F</kbd> ขี่มอเตอร์ไซค์`; }
  else pr.hidden = true;
  updateNPCs(dt);
  checkAppts();

  // arrive at target
  if (S.target && Math.hypot(S.target.x-S.px, S.target.z-S.pz) < 6){ toast(`ถึง ${S.target.name} แล้ว`, "good"); S.target = null; }
}

/* ================= sky & lighting ================= */
const SKY = [[0,0x0b1424],[5,0x1a2440],[6,0xe9a77a],[7.5,0xbfd9ef],[12,0x9fcbf0],[17,0xbfd4e6],[18.3,0xe48f5d],[19.3,0x2a2f52],[21,0x0b1424],[24,0x0b1424]];
const cA = new THREE.Color(), cB = new THREE.Color(); let outT = -9;
function skyAt(h){ for (let i=0;i<SKY.length-1;i++){ if (h>=SKY[i][0] && h<=SKY[i+1][0]){ const t=(h-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]); return cA.set(SKY[i][1]).lerp(cB.set(SKY[i+1][1]), t).clone(); } } return new THREE.Color(SKY[0][1]); }
function lighting(t){
  const h = (minOfDay())/60;
  const col = skyAt(h); const wet = S.rain>0;
  if (wet) col.lerp(new THREE.Color(0x56606a), .55);
  scene.background = col; scene.fog.color = col; scene.fog.near = wet?40:90; scene.fog.far = wet?190:330;
  const day = clamp(Math.sin((h-6)/12*Math.PI), 0, 1) * (wet?.55:1);
  const ang = (h-6)/12*Math.PI;
  sun.position.set(S.px + Math.cos(ang)*120, Math.max(8, Math.sin(ang)*140), S.pz + 50);
  sun.target.position.set(S.px, 0, S.pz);
  sun.intensity = day * .95; sun.color.setHSL(.1, .6, .6 + day*.3);
  hemi.intensity = .18 + day*.62;
  const night = day < .25;
  const ne = night ? .9 : clamp((.35-day)/.1,0,1)*.9;
  buildMats.forEach(m=>m.emissiveIntensity = ne);
  lampMat.color.setHex(night||day<.3 ? 0xffe0a0 : 0x666a6e);
  // rain particles follow the camera
  rain.visible = wet;
  if (wet){ const pa = rainGeo.attributes.position.array; rain.position.set(camera.position.x, 0, camera.position.z);
    for (let i=0;i<RAIN_N;i++){ pa[i*3+1] -= 1.1; if (pa[i*3+1]<0) pa[i*3+1] += 40; } rainGeo.attributes.position.needsUpdate = true; }
  FLOODS.forEach(f=>f.m.visible = S.rainH>=2);
  // outage: street lamps and windows go dark around a failed piece of equipment
  if (t - outT > .6){
    outT = t;
    const dark = S.fails.filter(f=>!f.end).map(f=>EQ[f.eqId]);
    const near = (x,z,r) => dark.some(e=>Math.hypot(e.x-x,e.z-z)<r);
    LAMPS.forEach(l=>{ l.m.material = near(l.x,l.z,60) ? lampOff : lampMat; });
    BLD.forEach(b=>{ b.m.material = near(b.x,b.z,55) ? darkMats[b.mi] : buildMats[b.mi]; });
  }
  truck.userData.hl.intensity = (S.inTruck && day<.4) ? 2.2 : 0;
  // beacons
  EQUIP.forEach(e => {
    const f = activeFail(e.id), ws = woFor(e.id), acc = ws.some(w=>w.status==="accepted");
    const show = f || ws.length;
    e.beam.visible = e.ring.visible = !!show;
    if (show){
      const c = f ? 0xff4848 : ws.some(w=>w.kind==="CM") ? 0xffc24b : 0x62b0ff;
      e.beam.material.color.setHex(c); e.ring.material.color.setHex(c);
      e.beam.material.opacity = f ? .18 + .14*Math.sin(t*6) : acc ? .22 : .1;
      e.ring.scale.setScalar(1 + .08*Math.sin(t*3));
    }
  });
}

function drawMini(t){
