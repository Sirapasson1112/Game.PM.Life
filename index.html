<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>PM Life สมุทรปราการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed canvas world; HUD card top-left, minimap top-right, objective chip, toasts bottom-center,
   touch controls bottom corners; CMMS tablet + inspection sheet open as a light "device screen" over the paused world.
   Single committed look: dark field HUD + light device screen (game is played day and night, so the HUD stays dark). */
:root{
  color-scheme:dark;
  --hud:rgba(13,19,25,.88); --hud2:rgba(255,255,255,.08); --hline:rgba(255,255,255,.14);
  --ink:#e9eff3; --muted:#a3b3bf; --amber:#f2b332; --ok:#45c08a; --bad:#f06b5f; --warn:#f0a63c; --info:#6aa7e6;
  --s-bg:#eef3f5; --s-panel:#ffffff; --s-panel2:#f3f6f8; --s-ink:#15232d; --s-muted:#5a6b77; --s-line:#d3dbe1;
  --s-ok:#1b8455; --s-ok-soft:#dff2e8; --s-bad:#c2342a; --s-bad-soft:#fbe4e1; --s-warn:#a96300; --s-warn-soft:#fcecd3;
  --s-info:#2766a3; --s-info-soft:#e1ecf7; --s-amber:#8a5a00; --s-amber-soft:#fcf0d2;
  --f-disp:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%;background:#0d1418;color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
#app{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));
  background:var(--hud);border:1px solid var(--hline);border-radius:12px;padding:10px 12px;width:min(300px,calc(100vw - 20px - 150px));display:grid;gap:7px;backdrop-filter:blur(6px)}
.clock{display:flex;align-items:baseline;gap:10px}
.clock .t{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--muted);line-height:1.25}
.clock .d b{color:var(--ink);font-weight:600}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.st label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.st label span{font-family:var(--f-mono);color:var(--ink)}
.bar{height:5px;border-radius:3px;background:var(--hud2);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.money{font-family:var(--f-disp);font-weight:600;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--hud2);color:var(--ink);white-space:nowrap}
.chip.bad{background:rgba(240,107,95,.22);color:#ffb2aa} .chip.warn{background:rgba(240,166,60,.2);color:#ffd08f}
.chip.ok{background:rgba(69,192,138,.2);color:#9fe8c4} .chip.info{background:rgba(106,167,230,.2);color:#b9d6f5}
.chip.amber{background:rgba(242,179,50,.22);color:#ffd877}
.veh{display:flex;gap:12px;font-size:12px;color:var(--muted)} .veh b{color:var(--ink);font-family:var(--f-mono)}

.mapcard{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));
  background:var(--hud);border:1px solid var(--hline);border-radius:12px;padding:6px;display:grid;gap:6px;width:min(220px,40vw)}
#mini{width:100%;height:auto;aspect-ratio:200/130;border-radius:7px;display:block;background:#2b5a78}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.hb{background:var(--hud2);border:1px solid var(--hline);border-radius:8px;padding:4px 6px;font-size:12px;white-space:nowrap}
.hb:hover{border-color:var(--amber)}
.hb kbd{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:3px}

.obj{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);
  background:var(--hud);border:1px solid var(--hline);border-left:4px solid var(--amber);border-radius:10px;padding:6px 12px;font-size:13px;max-width:min(440px,calc(100vw - 560px));text-align:center}
.obj small{display:block;color:var(--muted);font-size:11px}
@media (max-width:1000px){.obj{left:max(10px,env(safe-area-inset-left,0px));transform:none;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);max-width:calc(100vw - 20px);text-align:left}}

#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 46px);display:grid;gap:6px;width:min(460px,calc(100vw - 20px));pointer-events:none}
@media (pointer:coarse){#toasts{bottom:calc(env(safe-area-inset-bottom,0px) + 214px)}}
.toast{background:var(--hud);border:1px solid var(--hline);border-radius:10px;padding:7px 12px;font-size:13px;animation:tin .25s ease-out}
.toast b{font-size:11.5px;display:block;color:var(--muted)}
.toast.bad{border-color:var(--bad)} .toast.bad b{color:var(--bad)} .toast.ok b{color:var(--ok)} .toast.warn b{color:var(--warn)} .toast.info b{color:var(--info)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* touch controls */
.touch{display:none}
@media (pointer:coarse){.touch{display:block}}
.touch.force{display:block}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;border-radius:50%;
  background:rgba(13,19,25,.55);border:2px solid var(--hline);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(242,179,50,.85)}
.tbtns{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;gap:10px;justify-items:end}
.tbtn{border:2px solid var(--hline);background:rgba(13,19,25,.7);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;min-width:64px;touch-action:none}
.tbtn.big{width:92px;height:92px;border-radius:50%;background:rgba(242,179,50,.9);color:#1b1300;border-color:transparent;padding:6px;font-size:13px;line-height:1.2}
.tbtn[hidden]{display:none}

/* device screen (tablet / inspection) */
.screen-bg{position:absolute;inset:0;background:rgba(5,9,12,.55);display:grid;place-items:center;z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px))}
.device{background:#1c252d;border-radius:20px;padding:10px;width:min(980px,100%);height:min(720px,100%);display:grid;grid-template-rows:auto auto minmax(0,1fr);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 6px 8px;color:var(--ink)}
.dhead b{font-family:var(--f-disp);font-size:16px}
.dhead small{color:var(--muted);margin-left:6px}
.dclose{background:var(--hud2);border:1px solid var(--hline);border-radius:8px;padding:4px 12px}
.scr{background:var(--s-bg);color:var(--s-ink);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
#pTabs{display:flex;gap:2px;overflow-x:auto;padding:6px 8px 0;border-bottom:1px solid var(--s-line);background:var(--s-panel)}
#pTabs:empty{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;font-size:13px;color:var(--s-muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--s-ink);border-bottom-color:#e7a10f;font-weight:600}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--s-panel2);border-radius:999px;padding:0 6px}
.tab .n.bad{background:var(--s-bad);color:#fff}
#pBody{padding:14px;overflow:auto;display:grid;gap:14px;align-content:start;min-height:0}
.tb-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tb-title h3{font-size:17px}
.tb-title span,.note{font-size:12.5px;color:var(--s-muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kpi{background:var(--s-panel);border:1px solid var(--s-line);border-radius:10px;padding:10px 12px;display:grid;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--s-ok)}
.kpi.fail::before{background:var(--s-bad)} .kpi.na::before{background:var(--s-line)}
.kpi small{color:var(--s-muted);font-size:12px}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--s-panel2);border:1px solid var(--s-line);white-space:nowrap}
.pill.ok{background:var(--s-ok-soft);color:var(--s-ok);border-color:transparent} .pill.bad{background:var(--s-bad-soft);color:var(--s-bad);border-color:transparent}
.pill.warn{background:var(--s-warn-soft);color:var(--s-warn);border-color:transparent} .pill.amber{background:var(--s-amber-soft);color:var(--s-amber);border-color:transparent}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.flow button{text-align:left;background:var(--s-panel);border:1px solid var(--s-line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--s-muted)}
.flow button b{display:block;font-family:var(--f-disp);font-size:20px;color:var(--s-ink)}
.flow button:hover{border-color:#e7a10f}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-ink);border-radius:999px;padding:3px 11px;font-size:12.5px}
.filters button[aria-pressed="true"]{background:var(--s-ink);color:var(--s-panel);border-color:var(--s-ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--s-line);border-radius:10px;background:var(--s-panel)}
table.grid{border-collapse:collapse;font-size:12.5px;width:100%;min-width:760px}
table.grid th{text-align:left;font-weight:600;color:var(--s-muted);background:var(--s-panel2);padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--s-line);font-size:11.5px}
table.grid td{padding:7px 9px;border-bottom:1px solid var(--s-line);white-space:nowrap}
table.grid tr:last-child td{border-bottom:0}
td.code{font-family:var(--f-mono)}
.sts{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.sts.done{background:var(--s-ok-soft);color:var(--s-ok)} .sts.over{background:var(--s-bad-soft);color:var(--s-bad)}
.sts.open{background:var(--s-info-soft);color:var(--s-info)} .sts.doing{background:var(--s-amber-soft);color:var(--s-amber)}
.sts.ctr{background:var(--s-warn-soft);color:var(--s-warn)} .sts.em{background:var(--s-bad);color:#fff}
.mini{background:var(--s-panel);color:var(--s-ink);border:1px solid var(--s-line);border-radius:7px;padding:3px 10px;font-size:12.5px}
.mini:hover:not(:disabled){border-color:#e7a10f}
.mini:disabled{opacity:.5;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11.5px;color:var(--s-muted);text-align:center}
.cal .c{min-height:70px;background:var(--s-panel);border:1px solid var(--s-line);border-radius:7px;padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .c.we{background:var(--s-panel2)} .cal .c.today{border-color:#e7a10f;box-shadow:inset 0 0 0 1px #e7a10f}
.cal .c.blank{border:0;background:none}
.cal .dn{font-size:11px;color:var(--s-muted);font-family:var(--f-mono)}
.cal .cchip{border:0;border-radius:4px;font-size:10.5px;padding:1px 4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono)}
.route{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.route li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--s-panel);border:1px solid var(--s-line);border-radius:9px;padding:7px 10px;font-size:13px}
.route .no{width:24px;height:24px;border-radius:50%;background:var(--s-ink);color:var(--s-panel);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.route .no.em{background:var(--s-bad)}
.route small{color:var(--s-muted)}
.costrow{display:grid;gap:4px}
.costrow .l{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.costrow .sbar{height:10px;border-radius:5px;background:var(--s-panel2);border:1px solid var(--s-line);overflow:hidden}
.costrow .sbar i{display:block;height:100%;background:var(--s-ok)} .costrow .sbar i.mid{background:#d18a1a} .costrow .sbar i.low{background:var(--s-bad)}
.loglist{list-style:none;margin:0;padding:0;font-size:12.5px;display:grid;gap:5px}
.loglist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--s-line);padding-bottom:5px}
.line li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.line .tm{font-family:var(--f-mono);font-size:11px;color:var(--s-muted)}
.line .who{font-weight:600;font-size:12px}
.line .who.bad{color:var(--s-bad)} .line .who.ok{color:var(--s-ok)} .line .who.warn{color:var(--s-warn)} .line .who.info{color:var(--s-info)}
.line p{margin:0}

.sheet{background:var(--s-panel);border:1px solid var(--s-line);border-radius:10px;overflow:hidden}
.sheet-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:10px 12px;background:var(--s-panel2);border-bottom:1px solid var(--s-line);font-size:13px}
.sheet-h b{font-family:var(--f-mono)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--s-line)}
.kv span{display:block;color:var(--s-muted);font-size:11.5px}
.ck{width:100%;border-collapse:collapse;font-size:13.5px}
.ck td{padding:6px 12px;border-bottom:1px solid var(--s-line);vertical-align:middle}
.ck td:first-child{color:var(--s-muted);font-family:var(--f-mono);width:44px}
.ck td:last-child{text-align:right;width:46%}
.res{font-size:12.5px;font-weight:600} .res.ok{color:var(--s-ok)} .res.bad{color:var(--s-bad)}
.res small{display:block;font-weight:400;font-size:11.5px}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--s-line);background:var(--s-panel2)}
.meas{padding:12px;display:grid;gap:10px;border-top:1px solid var(--s-line)}
.readings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.readings div{background:var(--s-panel2);border-radius:7px;padding:6px 8px;font-size:12px;color:var(--s-muted)}
.readings b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--s-ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.act{text-align:left;background:var(--s-panel);color:var(--s-ink);border:1px solid var(--s-line);border-radius:9px;padding:9px 12px;display:grid;gap:2px}
.act:hover:not(:disabled){border-color:#e7a10f}
.act b{font-weight:600;font-size:14px} .act small{color:var(--s-muted);font-size:12px}
.act:disabled{opacity:.48;cursor:not-allowed}
.act.primary{background:var(--s-amber-soft);border-color:#e7a10f} .act.primary b{color:var(--s-amber)}
.act.danger{background:var(--s-bad-soft);border-color:var(--s-bad)} .act.danger b{color:var(--s-bad)}
.emhead{background:repeating-linear-gradient(135deg,var(--s-bad) 0 10px,transparent 10px 20px);height:8px;border-radius:6px}

/* modal (menus) */
.modal-bg{position:absolute;inset:0;z-index:20;background:rgba(5,9,12,.5);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--s-panel);color:var(--s-ink);border-radius:14px;max-width:540px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modal .mb{padding:18px 20px 12px;display:grid;gap:10px}
.modal h2{font-size:20px}
.modal p{margin:0} .modal ul{margin:0;padding-left:20px;display:grid;gap:4px}
.mActs{display:grid;gap:7px;padding:4px 20px 18px}
.btn{text-align:left;border:1px solid var(--s-line);background:var(--s-panel2);color:var(--s-ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:grid;gap:1px}
.btn small{font-weight:400;color:var(--s-muted);font-size:12px}
.btn.primary{background:#f2b332;border-color:#f2b332;color:#1b1300} .btn.primary small{color:#5c4500}
.btn.danger{background:var(--s-bad);border-color:var(--s-bad);color:#fff} .btn.danger small{color:#ffe1dd}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.close{text-align:center;background:none}
.report{width:100%;border-collapse:collapse;font-size:13.5px}
.report td,.report th{padding:6px 8px;border-bottom:1px solid var(--s-line);text-align:left}
.report th{color:var(--s-muted);font-weight:500;font-size:12px}
.grade{font-family:var(--f-disp);font-size:54px;font-weight:700;line-height:1}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.keys kbd{font-family:var(--f-mono);background:var(--s-panel2);border:1px solid var(--s-line);border-radius:5px;padding:0 6px;font-size:12px;justify-self:start}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;left:0;top:0;background:rgba(20,26,32,.84);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.wl small{font-weight:500;color:#ffd08f;margin-left:4px}
.wl.bad small{color:#ffb2aa}
.wl.hot{background:#f2b332;color:#1b1300;border-color:transparent;font-size:14px;padding:6px 12px}
.wl kbd{font-family:var(--f-mono);background:#1b1300;color:#f2b332;border-radius:4px;padding:0 5px;margin-right:7px;font-size:11px}
.wl.bad{border-color:var(--bad)}
.wl.gps{background:rgba(242,179,50,.92);color:#1b1300;border-color:transparent}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--hud);border:1px solid var(--hline);border-radius:9px;padding:4px 12px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}
@media (pointer:coarse){.hint{display:none}}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0d1418;color:var(--ink);font-family:var(--f-disp);font-size:18px;z-index:30;padding:20px;text-align:center}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}

</style>

  var srcs=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
  function webgl(){try{var c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){return false}}

    if(!webgl()){show('เบราว์เซอร์หรืออุปกรณ์นี้ปิด WebGL อยู่ ลองเปิดด้วย Chrome หรือ Safari และเปิด Hardware acceleration ในการตั้งค่าเบราว์เซอร์');return}

    try{window.__startGame()}catch(e){console.error(e);show((e&&e.message)||String(e))}
  }
  function load(i){
    if(i>=srcs.length){show('โหลดเอนจิน 3D (three.js) ไม่ได้จากทุกแหล่ง ตรวจการเชื่อมต่ออินเทอร์เน็ต หรือถ้าเปิดจากหน้าตัวอย่างไฟล์ในแอป ให้ดาวน์โหลดแล้วเปิดด้วยเบราว์เซอร์แทน');return}

function speed(){return Math.max(.55,1-.06*(lvl()-1))*(S.flags.helper?.7:1)*(S.energy<25?1.25:1)}
function passTime(min,mode){
  const rate={work:.10,field:.14,drive:.06,commute:.05,rest:.015,leisure:.035}[mode]??.08;
  const t0=S.t, hung=hungry();
  S.t+=min;
  S.energy=clamp(S.energy-min*rate*(hung?1.5:1)*(S.flags.fit?.85:1),0,100);
  if(mode==='work'||mode==='field') S.mood=clamp(S.mood-min*.012,0,100);
  if(hung) S.mood=clamp(S.mood-min*.025,0,100);
  if(['work','field','drive'].includes(mode)&&S.scene!=='home'&&!(isWeekday(S.day)&&t0>=510&&t0<990)) S.otMin+=min;
  for(let h=Math.floor(t0/60)+1;h<=Math.floor(S.t/60);h++) hourlyTick(S.day*1440+h*60,false);
}
function advance(min,mode='work'){passTime(Math.max(1,Math.round(min)),mode)}
function hourlyTick(at,asleep){
  for(const a of ASSETS){
    const st=S.assets[a.id];
    if(S.wos.some(w=>w.kind==='EM'&&w.asset===a.id&&w.status!=='done')) continue;
    let m=1+st.latent*1.6+Math.max(0,70-st.cond)/12+st.cm*.8;
    if(S.wos.some(w=>w.kind==='PM'&&w.asset===a.id&&w.status!=='done'&&w.date<S.day)) m+=.8;
    if(S.flags.rain) m*=1.7;
    if(Math.random()<.00022*m) createFailure(a.id,at,asleep);
  }
  for(const f of S.fails){
    if(f.fixedAt==null&&!f.working&&at-f.at>300){
      const tt=at%1440, duty=isWeekday(Math.floor(at/1440))&&tt>=510&&tt<990;
      autoFix(f,'ทีมเวรฉุกเฉิน',duty&&!asleep);
    }
  }
  const tt=at%1440;
  if(!asleep&&isWeekday(S.day)&&tt>=540&&tt<=1020&&Math.random()<.07) chatter();
}

  const L=[['ธุรการ','ใครยังไม่ส่งใบเบิกค่าน้ำมันเดือนนี้ ส่งภายในวันศุกร์นะคะ'],['น้องเอ็ม (ช่าง)','ถ.เทพารักษ์ รถติดยาวมากครับ เลี่ยงได้เลี่ยง'],

    ['ศูนย์สั่งการ','ประกาศดับไฟตามแผน ถ.ศรีนครินทร์ วันเสาร์นี้ 09:00–15:00'],['พี่สมชาย (ช่างอาวุโส)','ใครผ่านบางพลีฝากซื้อกาแฟเย็นด้วยนะ']];

function createFailure(id,at,asleep){
  const a=AM[id], ty=TYPES[a.type], w=newWO('EM',id,Math.floor(at/1440),{created:at});
  const f={id:w.code,asset:id,at,cause:pick(CAUSES),fixedAt:null,mttr:null,by:null,working:false};
  w.fail=f.id; S.wos.push(w); S.fails.push(f);

function autoFix(f,by,penal){
  f.fixedAt=f.at+RI(250,380); f.mttr=(f.fixedAt-f.at)/60; f.by=by; f.working=false;
  const w=S.wos.find(x=>x.fail===f.id); if(w){w.status='done';w.doneDay=Math.floor(f.fixedAt/1440)}
  const st=S.assets[f.asset]; st.cond=Math.max(st.cond,72); st.latent=0;
  spend('ctr',RI(8,14)*1000,`${f.id} ${by} แก้ไขแทน`);
  if(S.site&&S.site.wo===f.id){S.site=null;if(PANEL==='site')closePanel()}
  if(penal){S.trust=clamp(S.trust-5,0,100);msg('หัวหน้าศูนย์ฯ',`${f.id} รอนานเกิน 5 ชม. ผมให้${by}เข้าไปแก้แล้ว MTTR ${f.mttr.toFixed(1)} ชม. เกินเป้า ครั้งหน้ารีบเข้าไปนะ`,'bad')}
  else msg(by,`แก้ไข ${f.asset} เรียบร้อย จ่ายไฟคืนแล้ว (${f.cause[0]})`,'ok');
}

  const done=pms.filter(w=>w.status==='done').length;
  const denom=Math.max(planned.length,done);
  const overdue=planned.filter(w=>w.status!=='done'&&w.date<Math.min(upto+1,S.day)).length;
  const fl=S.fails.filter(f=>mkOf(Math.floor(f.at/1440))===mk), fixed=fl.filter(f=>f.mttr!=null);
  return {total:pms.length,planned:planned.length,done,comp:denom?done/denom*100:null,over:planned.length?overdue/planned.length*100:null,
    mttr:fixed.length?fixed.reduce((s,f)=>s+f.mttr,0)/fixed.length:null,fails:fl.length,
    insp:done+S.wos.filter(w=>w.kind!=='PM'&&mkOf(w.date)===mk&&w.status==='done').length};
}
function kpiPass(k){return {comp:k.comp==null?null:k.comp>=90,over:k.over==null?null:k.over<=10,mttr:k.mttr==null?null:k.mttr<=4,fails:k.fails<=5}}
function monthReport(mk){
  const last=dayIdx(Math.floor(mk/12),mk%12+1,0), k=kpi(mk,last), p=kpiPass(k);
  const passes=Object.values(p).filter(v=>v!==false).length;
  const sp=S.spend[mk]||{parts:0,ctr:0,labor:0,other:0}, used=Object.values(sp).reduce((a,b)=>a+b,0), bud=Object.values(BUDGET).reduce((a,b)=>a+b,0);
  const score=passes*20+(S.trust-50)/2-(used>bud?10:0);
  const grade=score>=82?'A':score>=62?'B':score>=42?'C':'D';
  const bonus={A:5000,B:2500,C:0,D:0}[grade];
  S.money+=bonus; S.trust=clamp(S.trust+{A:5,B:2,C:-2,D:-6}[grade],0,100); S.xp+=passes*10;
  S.reports[mk]={...k,grade,bonus,used};
  MODALQ.push(()=>showReport(mk,k,p,grade,bonus,used,bud));
}

function enterVehicle(k){
  S.drive=k; const v=S.veh[k]; v.v=0;
  if(k==='truck'&&!S.flags.dressed) toast('ขับรถปฏิบัติการ อย่าลืมว่าออกหน้างานต้องใส่ชุดปฏิบัติงาน','warn');
}
function exitVehicle(){
  const v=S.veh[S.drive]; const a=v.a;
  const tries=[[Math.cos(a+Math.PI/2),Math.sin(a+Math.PI/2)],[Math.cos(a-Math.PI/2),Math.sin(a-Math.PI/2)],[-Math.cos(a),-Math.sin(a)],[Math.cos(a),Math.sin(a)]];
  for(const [dx,dy] of tries){for(const r of [1.1,1.6,2.2]){const x=v.x+dx*r,y=v.y+dy*r;if(canWalk(x,y)){S.p={x,y,dir:1};v.v=0;S.drive=null;return}}}
  toast('ลงจากรถตรงนี้ไม่ได้ ลองขยับรถก่อน','warn');
}

function openPanel(mode){PANEL=mode;document.getElementById('panel').hidden=false;renderPanel();setTimeout(()=>document.getElementById('pClose').focus(),20)}
function closePanel(){PANEL=null;document.getElementById('panel').hidden=true}
function panelOpen(){return PANEL!=null}
function A(label,meta,fn,o={}){const i=ACTS.push(()=>{fn();post()})-1;return `<button type="button" class="act ${o.kind||''}" data-a="${i}" ${o.dis?'disabled':''}><b>${esc(label)}</b>${meta?`<small>${esc(o.dis&&o.why?o.why:meta)}</small>`:''}</button>`}
function B(label,fn,o={}){const i=ACTS.push(()=>{fn();post()})-1;return `<button type="button" class="${o.cls||'mini'}" data-a="${i}" ${o.dis?'disabled':''} ${o.attr||''}>${label}</button>`}
function renderPanel(){
  if(!PANEL) return;
  ACTS=[];
  const tabs=document.getElementById('pTabs'), body=document.getElementById('pBody');
  const keep=body.scrollTop;
  if(PANEL==='site'){
    if(!S.site){closePanel();return}
    const w=findWO(S.site.wo), a=AM[w.asset];
    document.getElementById('pTitle').textContent=S.site.em?'ความขัดข้อง · '+w.code:'ใบตรวจสอบบำรุงรักษา';
    document.getElementById('pSub').textContent=`${a.id} · ${hhmm(S.t)}`;
    document.getElementById('pClose').textContent='พักใบตรวจไว้';
    tabs.innerHTML=''; body.innerHTML=S.site.em?sceneEM():sceneSite();
  } else {
    document.getElementById('pTitle').textContent='CMMS';
    document.getElementById('pSub').textContent='ระบบบำรุงรักษาเชิงป้องกัน · Plant 7901';
    document.getElementById('pClose').textContent='ปิด';
    const over=S.wos.filter(w=>woSt(w)==='over').length, em=S.wos.filter(w=>woSt(w)==='em').length, st=routeStops().length;
    const n={wo:over?`<span class="n bad">${over}</span>`:'',map:st?`<span class="n">${st}</span>`:'',fail:em?`<span class="n bad">${em}</span>`:''};
    tabs.innerHTML=TABS.map(([k,l])=>B(`${l}${n[k]||''}`,()=>{TAB=k},{cls:'tab',attr:`role="tab" aria-selected="${TAB===k}"`})).join('');
    body.innerHTML={home:tabHome,cal:tabCal,wo:tabWO,map:tabMap,fail:tabFail,cost:tabCost,line:tabLine}[TAB]();
  }
  body.scrollTop=keep;
}

function solidOut(x,y){return !WALKABLE.has(G(Math.floor(x),Math.floor(y)))}
function canWalk(x,y){
  const r=.28;
  if(S.scene==='out') return !(solidOut(x-r,y-r)||solidOut(x+r,y-r)||solidOut(x-r,y+r)||solidOut(x+r,y+r));
  const sc=S.scene, s=(a,b)=>ICH(sc,Math.floor(a),Math.floor(b))!=='.';
  return !(s(x-r,y-r)||s(x+r,y-r)||s(x-r,y+r)||s(x+r,y+r));
}
function canDrive(x,y){const r=.42;for(const [dx,dy] of [[-r,-r],[r,-r],[-r,r],[r,r]]) if(!DRIVABLE.has(G(Math.floor(x+dx),Math.floor(y+dy)))) return false;return true}
let MOVING=false;
function walkUpdate(dt,inp){
  const sprint=KEYS['shift']&&S.energy>15;
  const sp=(S.scene==='out'?4.4:3.0)*(sprint?1.6:1)*(S.energy<20?.75:1);
  MOVING=false;
  if(inp.m<.1) return false;
  const fx=-Math.sin(CAM.yaw), fz=-Math.cos(CAM.yaw), rx=Math.cos(CAM.yaw), rz=-Math.sin(CAM.yaw);
  let mx=rx*inp.x+fx*(-inp.y), mz=rz*inp.x+fz*(-inp.y); const l=Math.hypot(mx,mz)||1; mx/=l; mz/=l;
  const k=sp*inp.m*dt, nx=S.p.x+mx*k, ny=S.p.y+mz*k;
  if(canWalk(nx,S.p.y)) S.p.x=nx; if(canWalk(S.p.x,ny)) S.p.y=ny;
  FACE=Math.atan2(mx,mz); MOVING=true;
  walkPhase+=dt*sp*2.6*inp.m;
  if(sprint) S.energy=clamp(S.energy-dt*.15,0,100);
  return true;
}
function driveUpdate(dt,inp){
  const v=S.veh[S.drive];
  const rush=isWeekday(S.day)&&((S.t>=420&&S.t<=570)||(S.t>=990&&S.t<=1140));
  let max=(S.drive==='truck'?10:11.5)*(rush?.7:1)*(S.flags.traffic?.8:1)*(S.flags.rain&&S.t>=780&&S.t<=1080?.85:1);
  if(v.fuel<=0){max=0;if(!v.warned){v.warned=true;toast('น้ำมันหมด! ลงจากรถแล้วกดที่รถเพื่อเรียกรถช่วยเหลือ','bad')}}
  const thr=-inp.y, st=inp.x;
  if(thr>.1){v.v=Math.min(max*thr,v.v+6*thr*dt)}
  else if(thr<-.1){if(v.v>.3)v.v=Math.max(0,v.v-16*(-thr)*dt);else v.v=Math.max(-3.5,v.v-4*(-thr)*dt)}
  else v.v*=Math.max(0,1-dt*1.1);
  if(v.v>max)v.v=max;
  if(Math.abs(v.v)<.03&&Math.abs(thr)<.1) v.v=0;
  v.a+=st*1.9*dt*clamp(v.v/3,-1,1);
  const dx=Math.cos(v.a)*v.v*dt, dy=Math.sin(v.a)*v.v*dt;
  let moved=0;
  if(canDrive(v.x+dx,v.y+dy)){v.x+=dx;v.y+=dy;moved=Math.hypot(dx,dy)}
  else if(canDrive(v.x+dx,v.y)){v.x+=dx;v.v*=.85;moved=Math.abs(dx)}
  else if(canDrive(v.x,v.y+dy)){v.y+=dy;v.v*=.85;moved=Math.abs(dy)}
  else v.v*=.2;
  v.fuel=Math.max(0,v.fuel-moved*.07);
  if(v.fuel>0) v.warned=false;
  S.p.x=v.x; S.p.y=v.y;
}

(function camInput(){

  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(P.size===2){const [a,b]=[...P.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
  cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
    if(P.size===2){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)CAM.zoom=clamp(CAM.zoom*pd/d,.45,2.4);pd=d;return}
    CAM.yaw-=(e.clientX-p.x)*.0065;CAM.pitch=clamp(CAM.pitch+(e.clientY-p.y)*.0045,.12,1.3);CAM.lastDrag=performance.now()/1000;p.x=e.clientX;p.y=e.clientY});
  const up=e=>{P.delete(e.pointerId);pd=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();CAM.zoom=clamp(CAM.zoom*(1+e.deltaY*.0012),.45,2.4)},{passive:false});
  addEventListener('keydown',e=>{if(e.key==='q'||e.key==='Q')CAM.yaw+=.25;if(e.key==='r'||e.key==='R')CAM.yaw-=.25});
})();

function renderToasts(){
  const now=performance.now(), box=document.getElementById('toasts');
  let changed=false;
  const live=TOASTQ.filter(t=>t.until&&t.until>now);
  while(live.length<3&&TOASTQ.some(t=>!t.until)){const t=TOASTQ.find(t=>!t.until);t.until=now+4500;live.push(t);changed=true}
  for(let i=TOASTQ.length-1;i>=0;i--)if(TOASTQ[i].until&&TOASTQ[i].until<=now){TOASTQ.splice(i,1);changed=true}
  if(changed) box.innerHTML=TOASTQ.filter(t=>t.until).map(t=>`<div class="toast ${t.kind}">${t.who?`<b>${esc(t.who)}</b>`:''}${esc(t.text)}</div>`).join('');
}

  if(S.scene==='out'&&S.drive){driveUpdate(dt,inp);MOVING=false} else walkUpdate(dt,inp);
  const rate=S.drive?3.3:S.spd;
  const mode=S.scene==='home'?'rest':S.scene==='office'?(onDuty()?'work':'rest'):S.drive?(S.drive==='car'?'commute':'drive'):'field';
  passTime(dt*rate,mode);
  trafficUpdate(dt);
  if(S.site&&S.scene==='out'){const a=AM[findWO(S.site.wo)?.asset];if(a&&Math.hypot(a.x-S.p.x,a.y-S.p.y)>14){if(S.site.em){const f=S.fails.find(x=>x.id===S.site.wo);if(f)f.working=false}S.site=null;toast('ออกจากหน้างานแล้ว ใบตรวจที่ยังไม่บันทึกถูกยกเลิก','warn')}}
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S){
    const paused=PANEL||modalOpen();
    if(!paused) update(dt); else MOVING=false;
    findTargets();
    updateWorld3D(dt,now);
    R3.render(scene,camera);
    placeLabels();
    hudT+=dt; saveT+=dt;
    if(hudT>.2){hudT=0;updateHud();drawMini();renderToasts();if(!paused&&checkVitals()){closePanel()}flushModal()}
    if(saveT>5){saveT=0;save()}
  }
  requestAnimationFrame(frame);
}
/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  buildWorld(); initTraffic(); buildOutdoor(); buildInterior('home'); buildInterior('office'); decorHome(); decorOffice(); resize();
  const saved=(window.claude?.hot?.data&&window.claude.hot.data.S)||load();
  if(saved&&saved.ver===2){S=saved}else{newGame();MODALQ.push(howTo)}
  document.getElementById('loading').hidden=true;
  updateHud(true); flushModal(); requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({S}));
{const go=()=>{try{boot();window.__booted=true}catch(e){console.error(e);window.__gameFail('เริ่มเกมไม่สำเร็จ: '+e.message+(e.stack?' · '+String(e.stack).split('\n')[1]:''))}};
  const ready=window.claude?.hot?.ready;
  Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(()=>ready?ready(()=>go()):go())}


};
